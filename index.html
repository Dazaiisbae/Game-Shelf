.sec-h button{border:0;background:none;color:var(--aqua-deep);font-weight:800;font-size:13px;padding:2px}

/* Now playing */
.now{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:16px;border-radius:var(--rad,22px);position:relative;overflow:hidden}
.now::before{content:"";position:absolute;inset:-40%;z-index:-1;opacity:.35;background:var(--now-bg,none) center/cover;filter:blur(30px) saturate(1.4)}
.now-disc{position:relative;border-radius:50%;box-shadow:0 0 0 4px rgba(255,255,255,.7),0 10px 26px rgba(10,50,100,.35)}
.now-disc.playing .cd{animation:spin 6s linear infinite}
.now h2{margin:3px 0 4px;font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.now .m{display:block;color:var(--soft);font-size:13px;font-weight:600}
.now-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.now-switch{grid-column:1 / -1;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-top:4px;border-top:1px solid var(--line)}
.now-switch button{flex:0 0 auto;border:0;background:none;padding:6px 0 0;border-radius:50%;opacity:.55}
.now-switch button[aria-pressed=true]{opacity:1}
.now.idle .cd{opacity:.6}
@media (max-width:420px){ .now{grid-template-columns:1fr;justify-items:center;text-align:center} .now-actions{justify-content:center} }

/* Stat strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.strip button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 10px 9px;border-radius:var(--rad-sm,16px);text-align:left;min-width:0}
.strip b{font-size:22px;font-weight:900;line-height:1}
.strip span{font-size:11px;font-weight:800;color:var(--soft);display:flex;align-items:center;gap:4px;white-space:nowrap}
.strip .gl{width:100%;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.strip .gl i{display:block;height:100%;background:var(--holo)}

/* Rails */
.rail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 6px;scroll-snap-type:x proximity}
.rail-item{flex:0 0 92px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;text-align:center;scroll-snap-align:start}
.rail-item .t{font-size:12px;font-weight:800;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.rail-item .m{font-size:11px;font-weight:600;color:var(--soft);margin-top:-3px}
.rail-item .cd{box-shadow:0 5px 12px rgba(10,50,100,.25)}
.rail-series{flex:0 0 150px}
.rail-series.tile{padding:10px}
.rail-series .tile-art{height:92px}

/* Library */
.lib-head{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.lib-head .seg-mini{align-self:flex-start}
.lib-head .search{margin:0}
#gameList{display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr)) !important;gap:8px !important}
#gameList > .count-line,#gameList > .empty{grid-column:1 / -1}
.gcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:var(--rad-sm,16px);text-align:center;min-width:0;position:relative}
.gcard .t{font-size:12px;font-weight:800;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.gcard .m{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--soft)}
.gcard .stars{font-size:10px}
.gcard.skip,.gcard.dropped{opacity:.7}
.gcard .cd-wrap{position:relative;border-radius:50%}
.gcard.playing .cd-wrap{box-shadow:0 0 0 2px var(--aqua),0 0 10px rgba(31,162,227,.5)}
.gcard.complete .cd-wrap{box-shadow:0 0 0 2px #F2C14E,0 0 10px rgba(242,193,78,.6)}
.gcard.todo .cd,.gcard.skip .cd,.gcard.dropped .cd,.gcard.hold .cd{opacity:.55}

/* Game page (detail sheet) */
.gs-top{display:flex;gap:14px;align-items:center}
.gs-disc{position:relative;border-radius:50%;flex:0 0 auto;box-shadow:0 8px 20px rgba(10,50,100,.3)}
.gs-top h3{font-size:20px;line-height:1.2;overflow-wrap:anywhere;margin:2px 0 4px}
.gs-top .m{display:block;color:var(--soft);font-size:13px;font-weight:600}
.gs-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:14px 0}
.gs-facts div{padding:8px;border-radius:var(--rad-sm,14px);background:var(--tint);border:1px solid var(--edge);min-width:0}
.gs-facts b{display:block;font-size:15px;font-weight:900;overflow-wrap:anywhere}
.gs-facts span{font-size:11px;font-weight:700;color:var(--soft)}
.gs-status{display:flex;flex-wrap:wrap;gap:6px}
.gs-notes{margin-top:12px;padding:10px 12px;border-radius:var(--rad-sm,14px);background:var(--field);border:1px solid var(--edge);font-size:14px;white-space:pre-wrap}
.gs-actions{display:flex;gap:8px;margin-top:14px}
.gs-actions button{flex:1;padding:12px;font-weight:800}

/* Stats bento */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bx{padding:14px;border-radius:var(--rad,22px);min-width:0}
.bx.w2{grid-column:span 2}
.bx h3{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bx h3 .mini-btn{text-transform:none;letter-spacing:0}
.bx .huge{font-size:40px;font-weight:900;line-height:1}
.bx .sub{font-size:12px;font-weight:700;color:var(--soft)}
.bx.hero{display:flex;align-items:center;gap:18px}
.bx.hero .bigdisc{width:132px;height:132px;flex-basis:132px}
.bx .bar-row:last-child{margin-bottom:0}
.bx .recap-grid{margin-top:8px}
.bx .cols{height:130px}
.bx.goal .bar{height:12px;margin-top:10px}
.mini-ring{width:64px;height:64px;border-radius:50%;margin-top:8px;
  background:conic-gradient(#B49CFF 0,#FF9FD8 calc(var(--g) * .5),#7FE7FF var(--g),var(--line) var(--g) 100%);
  -webkit-mask:radial-gradient(circle closest-side,transparent 0 70%,#000 72%);mask:radial-gradient(circle closest-side,transparent 0 70%,#000 72%)}
.ring-wrap{position:relative;width:64px;height:64px;margin-top:6px}
.ring-wrap .mini-ring{margin:0;position:absolute;inset:0}
.ring-wrap b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
.scroll-y{max-height:300px;overflow:auto;padding-right:4px}

@media (min-width:760px){
  main[data-tab=home],main[data-tab=library]{max-width:1180px}
  .now{grid-template-columns:auto minmax(0,1fr);padding:22px}
  .now h2{font-size:28px}
  .rail-item{flex-basis:112px}
  .rail-series{flex-basis:180px}
  #gameList{grid-template-columns:repeat(auto-fill,minmax(140px,1fr)) !important}
  .lib-head{flex-direction:row;align-items:center}
  .lib-head .search{flex:1;max-width:520px}
  main[data-tab=stats]{max-width:1180px}
  .bento{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .bx.w2{grid-column:span 2}
  .bx.w4{grid-column:1 / -1}
  .bx .recap-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:759px){ .bx.w4{grid-column:span 2} }

/* ===================== Home v2: the disc player ===================== */
:root{--lcd-bg:linear-gradient(180deg,#C4E6F5,#92C9E4);--lcd-ink:#08283D;--lcd-glow:none}
@media (prefers-color-scheme: dark){:root{--lcd-bg:linear-gradient(180deg,#0A2236,#051522);--lcd-ink:#86ECFF;--lcd-glow:0 0 6px rgba(134,236,255,.6)}}
:root[data-theme=chrome],:root[data-theme=midnight]{--lcd-bg:linear-gradient(180deg,#0A2236,#051522);--lcd-ink:#86ECFF;--lcd-glow:0 0 6px rgba(134,236,255,.6)}
:root[data-theme=cyber]{--lcd-ink:#3B1670}
:root[data-theme=holo],:root[data-theme=plaza]{--lcd-bg:linear-gradient(180deg,#E3F3FB,#BFE1F2);--lcd-ink:#1C3550;--lcd-glow:none}

.deck{display:grid;gap:18px;justify-items:center;padding-top:4px}
.deck-col{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.player{position:relative;width:min(320px,86vw);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.85),transparent 38%),linear-gradient(150deg,var(--glass-strong),var(--glass));
  border:1px solid var(--edge);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.75),inset 0 -14px 28px rgba(10,50,100,.2),0 18px 40px rgba(10,50,100,.3)}
.player::before{content:"";position:absolute;inset:6%;border-radius:50%;border:2px solid var(--edge);box-shadow:inset 0 0 0 7px rgba(255,255,255,.12)}
.window{position:relative;width:74%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle,rgba(0,25,50,.08),rgba(0,25,50,.3));box-shadow:inset 0 5px 16px rgba(0,20,40,.4)}
.window .cd{width:94% !important;height:94% !important;min-width:0 !important}
.window::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.08) 38%,transparent 55%,rgba(255,255,255,.18) 85%)}
.player.on .window .cd{animation:spin 3.6s linear infinite}
.window .hint{position:relative;z-index:1;font:700 12px/1.3 ui-monospace,Menlo,monospace;color:var(--soft);text-align:center;letter-spacing:.08em;padding:0 20%}
.led{position:absolute;top:13%;right:19%;width:9px;height:9px;border-radius:50%;background:#8A99A8;box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}
.player.on .led{background:#4BE3FF;box-shadow:0 0 8px #4BE3FF,0 0 14px rgba(75,227,255,.6)}
.engrave{position:absolute;bottom:8.5%;left:0;right:0;text-align:center;font:800 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.35em;color:var(--soft);opacity:.75}
@media (prefers-reduced-motion:reduce){.player.on .window .cd{animation:none}}

.lcd{width:min(360px,92vw);border-radius:12px;padding:10px 14px;background:var(--lcd-bg);color:var(--lcd-ink);
  font-family:ui-monospace,"SF Mono",Menlo,monospace;text-shadow:var(--lcd-glow);
  box-shadow:inset 0 2px 7px rgba(0,0,0,.28),0 0 0 2px var(--edge),0 4px 12px rgba(10,50,100,.15)}
.lcd-top{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.12em;opacity:.85}
.lcd-title{font-size:17px;font-weight:800;line-height:1.2;margin:5px 0 3px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-transform:uppercase}
.lcd-sub{font-size:11px;font-weight:700;letter-spacing:.06em;opacity:.8}
.lcd.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px}
.lcd.stats button{border:0;background:none;color:inherit;font:inherit;text-shadow:inherit;padding:6px 4px;border-radius:8px;text-align:center}
.lcd.stats button + button{border-left:1px dashed currentColor}
.lcd.stats b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.lcd.stats span{font-size:10px;font-weight:800;letter-spacing:.12em;opacity:.8}

.controls{display:flex;gap:10px;justify-content:center;align-items:flex-start}
.pctl{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;font-size:10px;font-weight:800;color:var(--soft);letter-spacing:.04em}
.pctl i{display:flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:50%;color:#25415A;font-style:normal;font-size:13px;font-weight:900;
  background:var(--gloss-chrome);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(10,50,100,.22)}
.pctl.main i{width:64px;height:64px;color:#fff;background:var(--gloss-aqua);border-color:rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 5px 14px rgba(10,110,180,.4)}
.pctl svg{width:22px;height:22px}
.pctl:active i{transform:translateY(1px) scale(.97)}
.pctl:disabled{opacity:.4}

.changer{width:100%;max-width:560px;padding:12px;border-radius:var(--rad,22px)}
.changer-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.changer-h .eyebrow{margin:0}
.changer .chips-row{margin:0}
.slots{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:16px 4px 6px;scroll-snap-type:x proximity}
.slot{flex:0 0 84px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;scroll-snap-align:start;
  transition:transform .25s cubic-bezier(.2,.9,.3,1.2)}
.slot .cd{box-shadow:0 5px 12px rgba(10,50,100,.25)}
.slot .t{font-size:11px;font-weight:800;line-height:1.2;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.slot[aria-pressed=true]{transform:translateY(-12px)}
.slot[aria-pressed=true] .cd{box-shadow:0 0 0 3px #fff,0 0 16px rgba(127,231,255,.85)}
@media (prefers-reduced-motion:reduce){.slot{transition:none}}
.load-bar{display:flex;align-items:center;gap:8px;margin-top:6px;padding:8px 10px;border-radius:var(--rad-sm,14px);background:var(--tint);border:1px solid var(--edge)}
.load-bar .t{flex:1;min-width:0;font-weight:900;font-size:14px;overflow-wrap:anywhere}

@media (min-width:860px){
  main[data-tab=home]{max-width:1100px}
  .deck{grid-template-columns:auto minmax(0,1fr);align-items:start;gap:28px;justify-items:stretch}
  .deck-col.left{width:auto}
  .deck-col.right{align-items:stretch}
  .player{width:360px}
  .lcd.stats,.changer{width:100%;max-width:none}
}

/* ===================================================================
   ShelfOS: glass desktop
   =================================================================== */
html,body{height:100%}
body{padding:0 !important;overflow:hidden;font-family:"Segoe UI","Avenir Next",system-ui,-apple-system,sans-serif;font-size:14px}
body::before{display:none}
:root{--tb:54px;--win-r:14px;--accent:#2E9BE0;--accent-2:#7FE7FF;--titlebar:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.18));
  --win-bg:rgba(240,248,255,.62);--pane:rgba(255,255,255,.55);--pane-line:rgba(14,53,87,.12);--hover:rgba(46,155,224,.12);--sel:rgba(46,155,224,.22)}
@media (prefers-color-scheme: dark){
  :root{--titlebar:linear-gradient(180deg,rgba(160,210,255,.16),rgba(160,210,255,.04));--win-bg:rgba(12,26,46,.66);--pane:rgba(10,22,40,.55);
    --pane-line:rgba(160,220,255,.14);--hover:rgba(127,231,255,.1);--sel:rgba(127,231,255,.2);--accent:#4FB6F2}
}

/* Wallpapers (all CSS, original) */
#os{position:fixed;inset:0;overflow:hidden;background:var(--wall);background-size:cover}
:root{--wall:
  radial-gradient(120% 80% at 10% 110%,rgba(80,220,200,.55),transparent 60%),
  radial-gradient(90% 70% at 90% -10%,rgba(120,190,255,.75),transparent 60%),
  conic-gradient(from 210deg at 60% 40%,#1D6FB8,#38B6E8,#7BE0D6,#2A8FD0,#1D6FB8)}
:root[data-wall=holo]{--wall:
  radial-gradient(60% 50% at 80% 20%,rgba(255,255,255,.8),transparent 70%),
  conic-gradient(from 140deg at 50% 60%,#BFF3FF,#D7C8FF,#FFD0EC,#FFF2C2,#CFFFE6,#BFF3FF)}
:root[data-wall=grid]{--wall:
  linear-gradient(180deg,transparent 55%,rgba(46,230,255,.2)),
  repeating-linear-gradient(90deg,rgba(120,220,255,.12) 0 1px,transparent 1px 48px),
  repeating-linear-gradient(0deg,rgba(120,220,255,.12) 0 1px,transparent 1px 48px),
  radial-gradient(80% 60% at 50% 110%,#1C4C8C,#081426 70%)}
:root[data-wall=frost]{--wall:
  radial-gradient(circle at 20% 30%,rgba(255,255,255,.9) 0 40px,transparent 140px),
  radial-gradient(circle at 75% 65%,rgba(255,255,255,.7) 0 30px,transparent 160px),
  radial-gradient(circle at 60% 15%,rgba(200,230,255,.8) 0 20px,transparent 120px),
  linear-gradient(160deg,#E9F3FA,#BFD6E6 60%,#9FBED3)}
:root[data-wall=grid],:root[data-wall=grid] body{color-scheme:dark}

/* Desktop icons */
.icons{position:absolute;top:14px;left:14px;bottom:calc(var(--tb) + 14px);display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,96px);gap:6px 10px;align-content:start}
.dicon{width:84px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border:1px solid transparent;border-radius:10px;background:none;color:#fff;
  font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,20,40,.8);text-align:center;line-height:1.2}
.dicon:hover,.dicon:focus-visible{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35)}
.dicon .glyph{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,rgba(255,255,255,.75),rgba(255,255,255,.25) 50%,rgba(255,255,255,.12) 51%,rgba(255,255,255,.35));
  border:1px solid rgba(255,255,255,.85);box-shadow:0 6px 14px rgba(0,30,60,.3),inset 0 1px 0 #fff;color:#0E4C7A}
.dicon .glyph svg{width:28px;height:28px}
:root[data-wall=holo] .dicon,:root[data-wall=frost] .dicon{color:#0E3557;text-shadow:0 1px 2px rgba(255,255,255,.9)}

/* Widgets */
.widgets{position:absolute;top:14px;right:14px;width:250px;display:flex;flex-direction:column;gap:10px}
.gadget{padding:12px;border-radius:16px;background:var(--win-bg);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 10px 26px rgba(0,30,60,.25);color:var(--ink)}
.gadget .eyebrow{margin-bottom:6px}
.gadget.np{display:flex;gap:10px;align-items:center;cursor:pointer;text-align:left;width:100%;font:inherit}
.gadget.np .cd{animation:spin 5s linear infinite}
.gadget .t{font-weight:800;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.gadget .m{color:var(--soft);font-size:12px}
.gadget .big{font-size:30px;font-weight:900;line-height:1}
.gadget .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.gadget .row3 button{border:0;background:var(--tint);border-radius:10px;padding:8px 2px;font:inherit;color:inherit}
.gadget .row3 b{display:block;font-size:18px;font-weight:900}
.gadget .row3 span{font-size:10px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
@media (prefers-reduced-motion:reduce){.gadget.np .cd{animation:none}}

/* Windows */
#wins{position:absolute;inset:0 0 var(--tb) 0;pointer-events:none}
.win{position:absolute;display:flex;flex-direction:column;pointer-events:auto;border-radius:var(--win-r);overflow:hidden;color:var(--ink);
  background:var(--win-bg);border:1px solid var(--edge);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);
  box-shadow:0 18px 50px rgba(0,25,55,.35),inset 0 1px 0 rgba(255,255,255,.6);min-width:300px;min-height:220px;
  animation:winIn .18s ease-out}
@keyframes winIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.win{animation:none}}
.win.inactive{box-shadow:0 8px 24px rgba(0,25,55,.22)}
.win.inactive .titlebar{opacity:.85}
.win.min{display:none}
.win.max{left:0 !important;top:0 !important;width:100% !important;height:100% !important;border-radius:0}
.titlebar{display:flex;align-items:center;gap:8px;height:40px;flex:0 0 40px;padding:0 6px 0 12px;background:var(--titlebar);border-bottom:1px solid var(--pane-line);
  cursor:default;user-select:none;-webkit-user-select:none;touch-action:none}
.titlebar .ti{width:18px;height:18px;color:var(--accent);flex:0 0 18px}
.titlebar .ti svg{width:18px;height:18px}
.titlebar .tt{flex:1;min-width:0;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbtns{display:flex;gap:4px}
.wbtns button{width:34px;height:26px;border-radius:7px;border:1px solid var(--edge);background:rgba(255,255,255,.25);color:var(--ink);font-size:13px;font-weight:700;line-height:1}
.wbtns button:hover{background:rgba(255,255,255,.5)}
.wbtns .close:hover{background:#E0465A;color:#fff;border-color:#E0465A}
.wbody{flex:1;min-height:0;overflow:auto;padding:14px;position:relative}
.grip{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 50%,var(--pane-line) 50% 58%,transparent 58% 70%,var(--pane-line) 70% 78%,transparent 78%)}
.win.max .grip{display:none}

/* Taskbar */
.taskbar{position:absolute;left:0;right:0;bottom:0;height:var(--tb);display:flex;align-items:center;gap:6px;padding:0 8px calc(env(safe-area-inset-bottom) * .5);z-index:9000;
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.14) 45%,rgba(255,255,255,.08) 55%,rgba(255,255,255,.2));
  border-top:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);color:var(--ink)}
@media (prefers-color-scheme: dark){.taskbar{background:linear-gradient(180deg,rgba(120,180,240,.22),rgba(20,40,70,.5) 50%,rgba(10,25,45,.6));border-top-color:rgba(160,220,255,.35)}}
.orb{width:44px;height:44px;border-radius:50%;flex:0 0 44px;border:1px solid rgba(255,255,255,.9);position:relative;
  background:radial-gradient(circle,#fff 0 4px,rgba(255,255,255,0) 4.5px),radial-gradient(circle,transparent 0 9px,rgba(255,255,255,.9) 9.5px 11px,transparent 11.5px),
    conic-gradient(from 200deg,#7FE7FF,#B49CFF,#FF9FD8,#FFE98A,#8CFFC9,#7FE7FF);
  box-shadow:0 0 0 2px rgba(255,255,255,.3),0 0 14px rgba(127,231,255,.7),inset 0 2px 4px rgba(255,255,255,.8)}
.orb[aria-expanded=true]{box-shadow:0 0 0 3px rgba(255,255,255,.6),0 0 22px rgba(127,231,255,1)}
.tasks{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;height:100%;align-items:center}
.task{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:7px;height:40px;padding:0 10px;border-radius:9px;border:1px solid transparent;background:none;color:inherit;font:inherit;font-size:12px;font-weight:700}
.task .ti{width:22px;height:22px;color:var(--accent)}
.task .ti svg{width:22px;height:22px}
.task span.lbl{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task:hover{background:rgba(255,255,255,.22)}
.task.open::after{content:"";position:absolute;left:30%;right:30%;bottom:3px;height:3px;border-radius:2px;background:var(--accent-2);box-shadow:0 0 6px var(--accent-2)}
.task.active{background:rgba(255,255,255,.35);border-color:rgba(255,255,255,.6)}
.task.pinned:not(.open) span.lbl{display:none}
.tray{display:flex;align-items:center;gap:8px;padding-left:6px;font-size:12px;font-weight:700;text-align:right;line-height:1.15}
.tray .mini-np{border:0;background:none;padding:0;display:flex}
.tray .mini-np .cd{animation:spin 4s linear infinite}
@media (prefers-reduced-motion:reduce){.tray .mini-np .cd{animation:none}}

/* Start menu */
.start{position:absolute;left:8px;bottom:calc(var(--tb) + 8px);width:min(380px,calc(100vw - 16px));max-height:calc(100% - var(--tb) - 20px);overflow:auto;z-index:9001;
  padding:14px;border-radius:18px;background:var(--win-bg);border:1px solid var(--edge);color:var(--ink);
  -webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);box-shadow:0 20px 50px rgba(0,25,55,.4)}
.start[hidden]{display:none}
.start .search{margin-bottom:10px}
.start-apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.start-apps button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;border:0;border-radius:12px;background:none;color:inherit;font:inherit;font-size:11px;font-weight:700}
.start-apps button:hover{background:var(--hover)}
.start-apps .glyph{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#0E4C7A;
  background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(255,255,255,.3) 50%,rgba(255,255,255,.15) 51%,rgba(255,255,255,.4));border:1px solid rgba(255,255,255,.9)}
.start-apps .glyph svg{width:22px;height:22px}
.start-res{display:flex;flex-direction:column;gap:2px}
.start-res button{display:flex;align-items:center;gap:10px;padding:6px 8px;border:0;border-radius:10px;background:none;color:inherit;font:inherit;text-align:left}
.start-res button:hover{background:var(--hover)}
.start-res .cd{--s:32px}
.start-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--pane-line);font-size:12px;color:var(--soft);font-weight:600}

/* Shared window UI */
.pane-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 8px}
.pane-h b{font-size:13px;font-weight:800}
.pane-h span{font-size:12px;color:var(--soft);font-weight:600}
.btn{border:1px solid var(--edge);background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.35));color:var(--ink);font:inherit;font-size:13px;font-weight:700;padding:7px 12px;border-radius:8px;box-shadow:0 1px 2px rgba(0,30,60,.12)}
.btn:hover{background:rgba(255,255,255,.75)}
.btn.primary{color:#fff;border-color:rgba(255,255,255,.6);background:linear-gradient(180deg,#6CC6F5,#2E9BE0 50%,#1F86CC 51%,#3AA8EA);text-shadow:0 1px 1px rgba(0,40,80,.35)}
.btn:disabled{opacity:.45}
@media (prefers-color-scheme: dark){.btn{background:linear-gradient(180deg,rgba(120,180,240,.22),rgba(60,110,170,.12))}.btn:hover{background:rgba(120,180,240,.3)}}
.group{border:1px solid var(--pane-line);border-radius:10px;padding:10px 12px 12px;margin:0 0 12px;background:var(--pane)}
.group legend{padding:0 6px;font-size:12px;font-weight:800;color:var(--soft)}

/* Now Playing app */
.np-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:4px 2px 14px;border-bottom:1px solid var(--pane-line)}
.np-art{border-radius:50%;box-shadow:0 0 0 4px rgba(255,255,255,.7),0 12px 28px rgba(0,30,60,.3)}
.np-art.on .cd{animation:spin 4s linear infinite}
.np-main h2{margin:3px 0 4px;font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.np-main .m{display:block;color:var(--soft);font-size:13px}
.np-ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.np-ctl .btn{display:inline-flex;align-items:center;gap:5px}
.np-ctl svg{width:16px;height:16px}
.np-ctl .btn.round{width:46px;height:46px;border-radius:50%;justify-content:center;padding:0}
.np-ctl .btn.round svg{width:20px;height:20px}
.qlist{margin-top:12px}
.qrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 6px;border-radius:8px}
.qrow:hover{background:var(--hover)}
.qrow .cd{--s:36px}
.qrow .t{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;color:inherit;font:inherit;font-weight:700;text-align:left;padding:0;cursor:pointer}
.qrow .m{display:block;font-size:11px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.np-art.on .cd{animation:none}}

/* Library app (explorer) */
.lib{display:grid;grid-template-columns:210px minmax(0,1fr);gap:0;height:100%;margin:-14px}
.side{border-right:1px solid var(--pane-line);background:var(--pane);overflow:auto;padding:10px 6px}
.side h4{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);margin:10px 8px 4px}
.side h4:first-child{margin-top:2px}
.nav{display:flex;align-items:center;gap:7px;width:100%;padding:5px 8px;border:0;border-radius:7px;background:none;color:inherit;font:inherit;font-size:13px;text-align:left}
.nav:hover{background:var(--hover)}
.nav[aria-current=true]{background:var(--sel);font-weight:700}
.nav .n{margin-left:auto;font-size:11px;color:var(--soft);font-weight:700}
.nav.sub{padding-left:24px;font-size:12px}
.nav .dot{flex:0 0 9px}
.libmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.ltool{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--pane-line);flex-wrap:wrap}
.ltool .search{flex:1;min-width:140px;margin:0;padding:7px 12px;border-radius:8px;font-size:13px}
.ltool select{margin:0;border-radius:8px;font-size:12px;padding:7px 24px 7px 10px}
.vt{display:flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden}
.vt button{border:0;background:none;color:inherit;padding:6px 9px;display:flex}
.vt button[aria-pressed=true]{background:var(--sel)}
.vt svg{width:16px;height:16px}
.crumb{padding:10px 12px 6px}
.crumb h3{font-size:17px;font-weight:800;margin:0;overflow-wrap:anywhere}
.crumb .m{font-size:12px;color:var(--soft);font-weight:600}
.crumb .tbar{margin-top:6px;max-width:320px}
#libList{flex:1;overflow:auto;padding:6px 10px 14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.file{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px 8px;border:1px solid transparent;border-radius:10px;background:none;color:inherit;font:inherit;text-align:center;min-width:0}
.file:hover{background:var(--hover);border-color:var(--pane-line)}
.file .t{font-size:12px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.file .m{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--soft);font-weight:600}
.file .cdw{border-radius:50%;position:relative}
.file.playing .cdw{box-shadow:0 0 0 2px var(--accent),0 0 10px rgba(46,155,224,.5)}
.file.complete .cdw{box-shadow:0 0 0 2px #F2C14E,0 0 10px rgba(242,193,78,.6)}
.file.todo .cd,.file.hold .cd,.file.dropped .cd,.file.skip .cd{opacity:.55}
.ftable{width:100%;border-collapse:collapse;font-size:13px}
.ftable th{position:sticky;top:-6px;text-align:left;font-size:11px;font-weight:800;color:var(--soft);padding:6px 8px;border-bottom:1px solid var(--pane-line);background:var(--win-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ftable td{padding:5px 8px;border-bottom:1px solid var(--pane-line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.ftable tr[data-game]{cursor:pointer}
.ftable tr[data-game]:hover td{background:var(--hover)}
.ftable .tcell{display:flex;align-items:center;gap:8px;font-weight:700}
.ftable .cd{--s:26px}
.libnav-m{display:none}

/* Game properties app */
.gp-top{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.gp-top .cd{box-shadow:0 10px 24px rgba(0,30,60,.3)}
.gp-top h2{margin:2px 0 4px;font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.gp-top .m{display:block;color:var(--soft);font-size:13px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{min-width:0}
.facts b{display:block;font-size:15px;font-weight:800;overflow-wrap:anywhere}
.facts span{font-size:11px;color:var(--soft);font-weight:600}
.gp-status{display:flex;flex-wrap:wrap;gap:6px}
.gp-status button{border:1px solid var(--edge);background:none;color:inherit;font:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px}
.gp-status button[aria-pressed=true]{color:#fff;background:linear-gradient(180deg,#6CC6F5,#2E9BE0 50%,#1F86CC 51%,#3AA8EA);border-color:rgba(255,255,255,.6)}
.gp-notes{white-space:pre-wrap;font-size:13px}
.gp-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.order-row{display:flex;align-items:center;gap:8px;font-size:13px}
.order-row span{flex:1}

/* Settings app */
.walls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.walls button{border:2px solid transparent;border-radius:10px;padding:3px;background:none;color:inherit;font:inherit;font-size:11px;font-weight:700}
.walls button[aria-pressed=true]{border-color:var(--accent)}
.walls i{display:block;height:54px;border-radius:7px;margin-bottom:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.set-row{display:flex;gap:6px;flex-wrap:wrap}
.set-note{font-size:12px;color:var(--soft);margin:8px 0 0}
.win textarea.bk{width:100%;min-height:90px;font:12px/1.3 ui-monospace,Menlo,monospace;padding:8px;border-radius:8px;border:1px solid var(--edge);background:var(--field);color:var(--ink);margin-top:8px}

/* Re-skin of reused parts inside windows */
.win .bento{gap:10px}
.win .bx{background:var(--pane);border:1px solid var(--pane-line);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:12px;clip-path:none}
.win .glass{-webkit-backdrop-filter:none;backdrop-filter:none}
.win .spin-wrap,.win .tl-top,.win .tl-card,.win .empty{background:var(--pane);border:1px solid var(--pane-line);box-shadow:none;border-radius:12px}
.win .chip-btn,.win .mini-btn,.win .aqua,.win .chrome{border-radius:8px}
.win .tl-mpill{background:var(--win-bg)}

/* Toast + edit dialog sit above everything */
.toast{bottom:calc(var(--tb) + 12px) !important;z-index:9500}
.scrim{z-index:9600}
.sheet{z-index:9700;left:50% !important;right:auto !important;top:50% !important;bottom:auto !important;width:min(560px,calc(100vw - 20px)) !important;max-height:88vh;
  border-radius:var(--win-r) !important;transform:translate(-50%,-46%) scale(.97) !important;opacity:0;pointer-events:none;transition:transform .2s,opacity .18s !important;
  background:var(--win-bg) !important;-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6)}
.sheet.open{transform:translate(-50%,-50%) !important;opacity:1;pointer-events:auto}
.sheet .sheet-head{margin:-18px -16px 10px;padding:10px 14px;background:var(--titlebar);border-bottom:1px solid var(--pane-line)}
.sheet .sheet-head h3{font-size:14px}

/* ===== Phone: home screen + full-screen apps ===== */
@media (max-width:759px){
  .icons{position:static;display:grid;grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:none;gap:6px;padding:18px 10px 6px}
  .dicon{width:auto}
  .widgets{position:static;width:auto;padding:4px 14px 14px}
  .desk{position:absolute;inset:0 0 var(--tb) 0;overflow:auto;padding-top:env(safe-area-inset-top)}
  .win{left:0 !important;top:0 !important;width:100% !important;height:100% !important;border-radius:0;min-width:0;border-left:0;border-right:0}
  .win.inactive{display:none}
  .wbtns button[data-wmax],.grip{display:none}
  .titlebar{height:46px;flex-basis:46px;padding-top:0}
  .lib{grid-template-columns:1fr}
  .side{display:none}
  .libnav-m{display:block;padding:8px 10px 0}
  .libnav-m select{width:100%;margin:0;border-radius:8px}
  .np-main{grid-template-columns:1fr;justify-items:center;text-align:center}
  .np-ctl{justify-content:center}
  .task .lbl{display:none}
  .tray .clockd{display:none}
}
@media (min-width:760px){ .desk{position:absolute;inset:0 0 var(--tb) 0} }
.wp-aurora{background:radial-gradient(120% 80% at 10% 110%,rgba(80,220,200,.55),transparent 60%),radial-gradient(90% 70% at 90% -10%,rgba(120,190,255,.75),transparent 60%),conic-gradient(from 210deg at 60% 40%,#1D6FB8,#38B6E8,#7BE0D6,#2A8FD0,#1D6FB8)}
.wp-holo{background:conic-gradient(from 140deg at 50% 60%,#BFF3FF,#D7C8FF,#FFD0EC,#FFF2C2,#CFFFE6,#BFF3FF)}
.wp-grid{background:repeating-linear-gradient(90deg,rgba(120,220,255,.25) 0 1px,transparent 1px 10px),repeating-linear-gradient(0deg,rgba(120,220,255,.25) 0 1px,transparent 1px 10px),#0C2240}
.wp-frost{background:radial-gradient(circle at 30% 30%,#fff 0 6px,transparent 24px),linear-gradient(160deg,#E9F3FA,#BFD6E6 60%,#9FBED3)}

/* Easier dismissing */
.showdesk{align-self:stretch;width:14px;margin:6px -4px 6px 4px;border:0;border-left:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);border-radius:0 6px 6px 0}
.showdesk:hover{background:rgba(255,255,255,.35)}
.wback,.whome{display:none}
@media (max-width:759px){
  .titlebar .ti{display:none}
  .wback,.whome{display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--accent);font:inherit;font-weight:700;font-size:15px;padding:0 6px 0 0}
  .whome{margin-left:auto;padding:0 4px}
  .whome svg{width:22px;height:22px}
  .wbtns{display:none}
  .titlebar{touch-action:pan-x}
  .showdesk{display:none}
}

/* ===== ShelfOS single-app mode ===== */
.stage{position:absolute;left:14px;right:14px;top:14px;bottom:calc(var(--tb) + 14px);display:flex;flex-direction:column;max-width:1240px;margin:0 auto;
  border-radius:18px;overflow:hidden;color:var(--ink);background:var(--win-bg);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);box-shadow:0 18px 50px rgba(0,25,55,.3),inset 0 1px 0 rgba(255,255,255,.6)}
.stage-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--pane-line);background:var(--titlebar);flex:0 0 auto}
.stage-h .ti{width:22px;height:22px;color:var(--accent)}
.stage-h .ti svg{width:22px;height:22px}
.stage-h h1{font-size:17px;font-weight:800;margin:0;flex:1;min-width:0;background:none;-webkit-text-stroke:0;filter:none;color:var(--ink);letter-spacing:0;text-transform:none;font-style:normal}
.stage-h h1::after{display:none}
.stage-body{flex:1;min-height:0;overflow:auto;padding:16px;position:relative}
.stage-body.flush{padding:0;overflow:hidden}
.stage-body.flush .lib{margin:0;height:100%}
.stage.swap .stage-body{animation:stageIn .16s ease-out}
@keyframes stageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stage.swap .stage-body{animation:none}}
.task.cur{background:rgba(255,255,255,.38);border-color:rgba(255,255,255,.65)}
.task.cur::after{content:"";position:absolute;left:28%;right:28%;bottom:3px;height:3px;border-radius:2px;background:var(--accent-2);box-shadow:0 0 6px var(--accent-2)}
.task.addt .ti{color:#fff;background:linear-gradient(180deg,#6CC6F5,#2E9BE0 50%,#1F86CC 51%,#3AA8EA);border-radius:50%;padding:3px;width:26px;height:26px}

/* Game drawer: tap outside to dismiss */
.dscrim{position:absolute;inset:0 0 var(--tb) 0;z-index:9100;background:rgba(5,25,50,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.dscrim.open{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:14px;bottom:calc(var(--tb) + 14px);right:14px;width:min(440px,calc(100vw - 28px));z-index:9200;overflow:auto;padding:18px;color:var(--ink);
  border-radius:18px;background:var(--win-bg);border:1px solid var(--edge);-webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);
  box-shadow:0 20px 50px rgba(0,25,55,.4);transform:translateX(calc(100% + 30px));transition:transform .25s cubic-bezier(.2,.9,.3,1)}
.drawer.open{transform:none}
.drawer .handle{display:none}
@media (prefers-reduced-motion:reduce){.drawer,.dscrim{transition:none}}
@media (max-width:759px){
  .stage{left:0;right:0;top:0;bottom:var(--tb);border-radius:0;border-left:0;border-right:0;padding-top:env(safe-area-inset-top)}
  .drawer{top:auto;left:0;right:0;bottom:var(--tb);width:auto;max-height:82%;border-radius:20px 20px 0 0;transform:translateY(105%)}
  .drawer.open{transform:none}
  .drawer .handle{display:block;width:44px;height:5px;border-radius:3px;background:var(--pane-line);margin:-6px auto 12px}
  .task{padding:0 8px}
}

/* No start menu: the taskbar already lists every app */
.taskbar{padding-left:10px}
.tasks{justify-content:center}
@media (max-width:759px){.tasks{justify-content:space-around}.task{flex:1;justify-content:center}}

/* Closed game drawer must be fully off-screen and never cover the taskbar */
.drawer{visibility:hidden;transition:transform .25s cubic-bezier(.2,.9,.3,1),visibility 0s linear .25s}
.drawer.open{visibility:visible;transition:transform .25s cubic-bezier(.2,.9,.3,1),visibility 0s}
@media (max-width:759px){ .drawer{transform:translateY(calc(100% + var(--tb) + 40px))} .drawer.open{transform:none} }

/* Edit dialog: fixed title bar, only the form scrolls */
.sheet{display:flex !important;flex-direction:column;padding:0 !important;overflow:hidden !important}
.sheet .sheet-head{margin:0 !important;flex:0 0 auto;padding:12px 16px !important}
.sheet-scroll{flex:1;min-height:0;overflow:auto;padding:4px 16px calc(18px + env(safe-area-inset-bottom))}

/* Add button: one clean round plus badge */
.addglyph{flex:0 0 26px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(180deg,#7CD0F7,#2E9BE0 50%,#1F86CC 51%,#3AA8EA);border:1px solid rgba(255,255,255,.75);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 6px rgba(10,90,160,.35)}
.addglyph svg{width:14px;height:14px;display:block}
</style>
</head>
<body>


<div id="os">
  <main class="stage" id="stage"><header class="stage-h"><span class="ti" id="stageIcon"></span><h1 id="stageTitle"></h1></header><div class="stage-body" id="stageBody"></div></main>
  <div class="dscrim" id="dscrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Game details"><div class="handle"></div><div id="drawerBody"></div></aside>
  <div class="start" id="start" hidden></div>
  <footer class="taskbar" id="taskbar">
    <div class="tasks" id="tasks"></div>
    <div class="tray" id="tray"></div>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head"><h3 id="sheetTitle">Add game</h3><button type="button" class="mode-btn" id="modeBtn">Add several</button></div>
  <div class="sheet-scroll" id="sheetScroll">
  <div id="singleTitle">
    <label for="fTitle">Game title</label>

  <div class="grid2">
    <div><label for="fSeries">Series</label>
      <input id="fSeries" list="seriesList" placeholder="Optional" autocomplete="off"><datalist id="seriesList"></datalist></div>
    <div><label for="fSub">Sub-series</label>

  <label for="fPlatform">Consoles</label>

  <div class="tag-sugs" id="consoleSugs"></div>
  <label>Status</label>
  <div class="seg" id="statusSeg">
    <button type="button" data-status="backlog" aria-pressed="true">Want to play</button>
    <button type="button" data-status="playing" aria-pressed="false">Playing</button>
    <button type="button" data-status="beaten" aria-pressed="false">Beaten</button>
    <button type="button" data-status="hold" aria-pressed="false">On hold</button>
    <button type="button" data-status="dropped" aria-pressed="false">Dropped</button>
    <button type="button" data-status="skip" aria-pressed="false">Not interested</button>
  </div>
  <div id="singleRest">
  <div id="dateRow" hidden>
    <label for="fDate" id="dateLabel">Date beaten</label>
    <input id="fDate" type="date">
  </div>
  <label class="toggle" id="completeRow" hidden><input type="checkbox" id="fComplete">100% complete</label>
  <div class="grid2">
    <div><label for="fHours">Hours played</label>
      <input id="fHours" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0"></div>
    <div><label>Rating</label>
      <div class="stars-input" id="fRating" role="group" aria-label="Rating">
        <button type="button" data-star="1" aria-label="1 star" aria-pressed="false">★</button><button type="button" data-star="2" aria-label="2 stars" aria-pressed="false">★</button><button type="button" data-star="3" aria-label="3 stars" aria-pressed="false">★</button><button type="button" data-star="4" aria-label="4 stars" aria-pressed="false">★</button><button type="button" data-star="5" aria-label="5 stars" aria-pressed="false">★</button>
      </div></div>
  </div>
  <label>Owned</label>
  <div class="seg small" id="ownSeg">
    <button type="button" data-own="physical" aria-pressed="false">Physical</button>
    <button type="button" data-own="digital" aria-pressed="false">Digital</button>
    <button type="button" data-own="wishlist" aria-pressed="false">Wishlist</button>
    <button type="button" data-own="" aria-pressed="true">Not set</button>
  </div>
  <label for="fTags">Tags</label>
  <input id="fTags" placeholder="e.g. JRPG, horror, cozy" autocomplete="off">
  <div class="tag-sugs" id="tagSugs"></div>
  <div id="replayRow" hidden>
    <label>Replays</label>
    <ul class="rep-list" id="repList"></ul>
    <div class="rep-add"><input id="fRepDate" type="date" aria-label="Replay date"><button type="button" class="mini-btn go" id="repAdd">Add replay</button></div>
  </div>
  <label for="fNotes">Notes</label>
  <textarea id="fNotes" rows="3" placeholder="What did you think?"></textarea>
  <label>Cover photo</label>
  <div class="cover-row">
    <span class="cover-prev none" id="coverPrev"></span>
    <div>
      <label class="pick chrome" for="fCover">Choose photo</label>
      <input type="file" id="fCover" accept="image/*" class="vh">
      <span class="photo-status" id="photoStatus" aria-live="polite"></span>
      <button type="button" class="linkbtn" id="coverRemove" hidden>Remove photo</button>
    </div>
  </div>
  </div>
  <div class="actions">
    <button class="chrome" id="cancelBtn">Cancel</button>
    <button class="aqua" id="saveBtn">Save game</button>
  </div>
  <button class="del" id="delBtn" hidden>Delete game</button>
  </div>
</div>

<script>
/* Standalone storage: saves on this device (IndexedDB, with localStorage as a fallback).
   Same API the app used inside Claude, so nothing else had to change. */
(function(){
  const DB = 'game-shelf', STORE = 'kv'; let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction(STORE, mode), req = fn(t.objectStore(STORE));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
  const ls = { get:k => localStorage.getItem('gs:' + k), set:(k, v) => localStorage.setItem('gs:' + k, v), del:k => localStorage.removeItem('gs:' + k) };
  window.storage = {
    async get(key){ let v; try{ v = await tx('readonly', st => st.get(key)); }catch(e){ v = ls.get(key); }
      if (v == null) throw new Error('Key not found: ' + key); return { key, value: v, shared: false }; },
    async set(key, value){ try{ await tx('readwrite', st => st.put(value, key)); }catch(e){ ls.set(key, value); } return { key, value, shared: false }; },
    async delete(key){ try{ await tx('readwrite', st => st.delete(key)); }catch(e){ ls.del(key); } return { key, deleted: true, shared: false }; },
    async list(prefix = ''){ let keys; try{ keys = await tx('readonly', st => st.getAllKeys()); }catch(e){ keys = Object.keys(localStorage).filter(k => k.startsWith('gs:')).map(k => k.slice(3)); }
      return { keys: keys.map(String).filter(k => k.startsWith(prefix)), prefix, shared: false }; }
  };
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
<script>
const KEY = 'game-shelf-data', CKEY = 'game-shelf-covers', PKEY = 'game-shelf-prefs';
let games = [], covers = {}, prefs = { goals:{}, theme:'ice' };
let tab = 'home', statsView = 'stats', libMode = 'series', homePick = null, gsId = null, changerPick = null, changerFilter = 'next';
let groupMode = 'series', sortMode = 'size';
let gStatus = 'all', gConsole = 'all', gOwn = 'all', gTag = 'all', gSort = 'status', query = '';
let spinInOrder = true, spinConsole = 'all', spinSeries = 'all', spinTag = 'all', spinOwned = false, spinResult = null, spinAngle = 0, spinning = false;
let goalEditing = false, recapYear = new Date().getFullYear();
let editingId = null, editingGame = null, formStatus = 'backlog', formCover, formRating = 0, formOwn = '', formReplays = [], photoBusy = false, delArmed = null;
const openCards = new Set(), picked = {}, subPick = {}, rowLists = {};
let openSeries = null, gFiltersOpen = false;
let tlYear = null, tlFilter = 'all';
let bulkMode = false, dupArmed = false, undoSnap = null;
const norm = t => (t || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const findDup = (title, exceptId) => games.find(g => g.id !== exceptId && norm(g.title) && norm(g.title) === norm(title));

const ST = {
  backlog:{short:'To play', long:'Want to play', cls:'todo'},
  playing:{short:'Playing', long:'In progress', cls:'playing'},
  beaten:{short:'Beaten', long:'Beaten', cls:'beat'},
  hold:{short:'On hold', long:'On hold', cls:'hold'},
  dropped:{short:'Dropped', long:'Dropped', cls:'dropped'},
  skip:{short:'Skip', long:'Not interested', cls:'skip'}
};
const NEXT = {backlog:'playing', playing:'beaten', beaten:'backlog', hold:'playing', dropped:'backlog', skip:'backlog'};
const LIST_ORDER = {playing:0, hold:1, backlog:2, beaten:3, dropped:4, skip:5};
const OWN = { physical:'Physical', digital:'Digital', wishlist:'Wishlist' };
const NO_CONSOLE = 'No console set', STANDALONE = 'Standalone games';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue = s => { let h = 0; for (const ch of s) h = (h*31 + ch.charCodeAt(0)) % 360; return h; };
const starStr = n => n ? '★'.repeat(n) + '☆'.repeat(5-n) : '';
const fmtH = h => (Math.round(h*10)/10) + 'h';
const seriesOf = g => g.series?.trim() || STANDALONE;
const subOf = g => (g.series?.trim() && g.sub?.trim()) || '';
const tagsOf = g => Array.isArray(g.tags) ? g.tags : [];
const clears = g => g.status==='beaten' ? 1 + (g.replays?.length || 0) : 0;
function counts(l){
  const c = { b:0, pl:0, hold:0, todo:0, drop:0, skip:0 };
  l.forEach(g => { if (g.status==='beaten') c.b++; else if (g.status==='playing') c.pl++; else if (g.status==='hold') c.hold++;
    else if (g.status==='dropped') c.drop++; else if (g.status==='skip') c.skip++; else c.todo++; });
  c.n = l.length - c.drop - c.skip; return c;
}
const nBeat = l => counts(l).b;
// A game's console field can hold several, separated by commas ("PS5, Switch 2")
const platformsOf = g => (g.platform || '').split(',').map(x=>x.trim()).filter(Boolean);
function canonConsole(p){
  const k = p.toLowerCase();
  for (const g of games) for (const x of platformsOf(g)) if (x.toLowerCase() === k) return x; // first spelling wins
  return p;
}
function consolesOf(g){
  const out = [...new Set(platformsOf(g).map(canonConsole))];
  return out.length ? out : [NO_CONSOLE];
}
const consoleOf = g => consolesOf(g)[0];
const onConsole = (g, c) => consolesOf(g).includes(c);
const consoles = () => [...new Set(games.flatMap(consolesOf))].filter(c=>c!==NO_CONSOLE).sort((a,b)=>a.localeCompare(b));
const parseConsoles = v => { const seen = new Set();
  return v.split(',').map(x=>x.trim()).filter(Boolean).map(canonConsole)
    .filter(x => { const k = x.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).join(', '); };
function allTags(){
  const m = new Map(); games.forEach(g => tagsOf(g).forEach(t => { const k = t.toLowerCase(); if (!m.has(k)) m.set(k, t); }));
  return [...m.values()].sort((a,b)=>a.localeCompare(b));
}
const hasTag = (g, t) => tagsOf(g).some(x => x.toLowerCase() === t.toLowerCase());
const discHTML = (g, size) => covers[g.id]
  ? `<span class="cd photo" style="--s:${size}px;background-image:url('${covers[g.id]}')"></span>`
  : `<span class="cd gen" style="--s:${size}px;--h:${hue(g.title)}"></span>`;
const statusCls = g => ST[g.status].cls + (g.complete ? ' complete' : '');
const badgeOf = g => g.complete ? '★' : ({beat:'✓', playing:'▶', hold:'❚❚', dropped:'✕', skip:'–'})[ST[g.status].cls] || '';
function toast(msg, undo){
  const t = $('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button id="undoBtn">Undo</button>' : ''}`;
  t.classList.toggle('has-action', !!undo); t.classList.add('show');
  if (!undo) undoSnap = null;
  clearTimeout(toast.h); toast.h = setTimeout(()=>{ t.classList.remove('show','has-action'); undoSnap = null; }, undo ? 6000 : 3200);
}
// Take a snapshot before a change so it can be undone from the toast
function snapshot(){ undoSnap = { games: JSON.stringify(games), covers: { ...covers } }; }
function undo(){
  if (!undoSnap) return;
  const coversChanged = Object.keys(undoSnap.covers).length !== Object.keys(covers).length || Object.keys(undoSnap.covers).some(k => undoSnap.covers[k] !== covers[k]);
  games = JSON.parse(undoSnap.games); covers = undoSnap.covers; undoSnap = null;
  save(); if (coversChanged) saveCovers();
  render(); toast('Undone');
}
const toInput = ts => { const d = ts ? new Date(ts) : new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fromInput = v => { const [y,m,d] = v.split('-').map(Number); return new Date(y, m-1, d, 12).getTime(); };
const fmtDate = ts => new Date(ts).toLocaleDateString();

/* Storage */
async function load(){
  try{ const r = await window.storage.get(KEY, false); if (r && r.value) games = JSON.parse(r.value); }catch(e){}
  try{ const c = await window.storage.get(CKEY, false); if (c && c.value) covers = JSON.parse(c.value); }catch(e){}
  try{ const pr = await window.storage.get(PKEY, false); if (pr && pr.value) prefs = { goals:{}, theme:'ice', ...JSON.parse(pr.value) }; }catch(e){}
  [...games].sort((a,b)=>(a.order??0)-(b.order??0)).forEach((g,i)=>{ g.order = i; });
  applyTheme(); render();
}
async function save(){ try{ await window.storage.set(KEY, JSON.stringify(games), false); }catch(e){ console.error('Save failed', e); } }
async function savePrefs(){ try{ await window.storage.set(PKEY, JSON.stringify(prefs), false); }catch(e){} }
async function saveCovers(){
  try{ const r = await window.storage.set(CKEY, JSON.stringify(covers), false); if (!r) throw new Error('no result'); return true; }
  catch(e){ console.error('Cover save failed', e); toast('Your photo could not be saved. Try a smaller photo or remove a few old covers.'); return false; }
}
function applyStatus(g, st){
  if (st==='beaten' && g.status!=='beaten') g.finishedAt = Date.now();
  if (st!=='beaten'){ g.finishedAt = null; g.complete = false; }
  if ((st==='playing' || st==='hold') && !(g.status==='playing' || g.status==='hold')) g.startedAt = Date.now();
  g.status = st;
}
function addHours(g, h){
  if (!h) return;
  g.hours = Math.max(0, Math.round(((g.hours || 0) + h) * 10) / 10);
  (g.log ||= []).push({ t: Date.now(), h });
}
const hoursIn = (g, y) => (g.log || []).filter(e => new Date(e.t).getFullYear() === y).reduce((a,e)=>a+e.h, 0);
function applyTheme(){
  document.documentElement.dataset.theme = prefs.theme || 'ice';
  document.querySelectorAll('[data-theme-pick]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themePick === (prefs.theme || 'ice')));
}

/* Grouping */
function groupBy(keyFn, mode = 'size', list = games){
  const map = {};
  list.forEach(g => { [].concat(keyFn(g)).forEach(k => (map[k] ||= []).push(g)); });
  const pct = l => { const c = counts(l); return c.n ? c.b / c.n : 0; };
  return Object.entries(map).sort((a,b) => {
    const la = a[0]===STANDALONE || a[0]===NO_CONSOLE, lb = b[0]===STANDALONE || b[0]===NO_CONSOLE;
    if (la !== lb) return la ? 1 : -1;
    if (mode==='az') return a[0].localeCompare(b[0]);
    if (mode==='progress') return pct(b[1]) - pct(a[1]) || b[1].length - a[1].length;
    return b[1].length - a[1].length || a[0].localeCompare(b[0]);
  });
}
function groupSubs(list, subFn){
  const subs = {}, loose = [];
  list.forEach(g => { const s = subFn(g); s ? (subs[s] ||= []).push(g) : loose.push(g); });
  const byOrder = arr => [...arr].sort((x,y)=> (x.order??0)-(y.order??0));
  return { subs: Object.entries(subs).sort((a,b)=>a[0].localeCompare(b[0], undefined, {numeric:true})).map(([n,l])=>[n, byOrder(l)]), loose: byOrder(loose) };
}

/* Render */
function oldRender(){
  document.querySelectorAll('.dock [data-tab]').forEach(t => t.setAttribute('aria-selected', t.dataset.tab===tab));
  $('view').dataset.tab = tab;
  $('view').innerHTML = tab==='home' ? viewHome() : tab==='library' ? viewLibrary() : tab==='stats' ? viewStats() : viewSpin();
  if (gsId && $('gsheet').classList.contains('open')) openGame(gsId, true);
  if (tab==='stats' && statsView==='timeline') initTimeline();
}
const empty = (title, msg = 'Tap + to add a game.') => `<div class="empty glass"><b>${title}</b>${msg}</div>`;
const tagChips = g => tagsOf(g).map(t => `<span class="tagc">${esc(t)}</span>`).join('');
const progStyle = c => c.n ? `--b:${c.b/c.n*100}%;--q:${(c.b+c.pl)/c.n*100}%;--r:${(c.b+c.pl+c.hold)/c.n*100}%` : '--b:0%;--q:0%;--r:0%';

function discRow(list, key){
  const selId = list.some(g=>g.id===picked[key]) ? picked[key] : list[0].id;
  rowLists[key] = list.map(g=>g.id);
  const idx = list.findIndex(g=>g.id===selId);
  const discs = list.map(g => {
    const b = badgeOf(g), n = clears(g);
    return `<button class="disc-btn ${statusCls(g)} ${g.id===selId?'sel':''}" data-pick="${g.id}" data-group="${esc(key)}" aria-label="${esc(g.title)}, ${ST[g.status].long}">
      <span class="ring">${discHTML(g, 52)}${b?`<span class="badge">${b}</span>`:''}${n > 1 ? `<span class="rep">×${n}</span>` : ''}</span></button>`;
  }).join('');
  const g = list.find(x=>x.id===selId);
  const meta = [g.complete ? '100% complete' : ST[g.status].long, clears(g) > 1 ? `beaten ${clears(g)} times` : '', g.platform, g.hours ? fmtH(g.hours) : ''].filter(Boolean).join(', ');
  const quick = { backlog:['Start playing','playing'], playing:['Mark beaten','beaten'], hold:['Resume','playing'] }[g.status];
  return `<div class="row">${discs}</div>
    <div class="caption"><span class="ct"><span class="t">${esc(g.title)}</span>
      <span class="m">${g.rating ? `<span class="stars">${starStr(g.rating)}</span> ` : ''}${esc(meta)}${g.own ? `<span class="own-tag">${OWN[g.own]}</span>` : ''}</span>
      ${tagChips(g)}</span>
    <span class="cap-btns">
      ${list.length > 1 ? `<button class="mv" data-move="${g.id}" data-dir="-1" data-group="${esc(key)}" aria-label="Move left" ${idx===0?'disabled':''}>‹</button><button class="mv" data-move="${g.id}" data-dir="1" data-group="${esc(key)}" aria-label="Move right" ${idx===list.length-1?'disabled':''}>›</button>` : ''}
      ${g.status==='playing' ? `<button class="mini-btn hr" data-hour="${g.id}" aria-label="Add one hour">+1h</button>` : ''}
      ${quick ? `<button class="mini-btn go" data-quick="${g.id}" data-to="${quick[1]}">${quick[0]}</button>` : ''}
      <button class="mini-btn" data-id="${g.id}">Edit</button></span></div>`;
}

function featured(list){
  const by = st => list.filter(g=>g.status===st);
  return by('playing')[0] || by('hold')[0] || by('beaten').sort((a,b)=>(b.finishedAt||0)-(a.finishedAt||0))[0] || [...list].sort((a,b)=>(a.order??0)-(b.order??0))[0];
}
function fanArt(list, size){
  const c = counts(list), f = featured(list);
  const rest = [...list].filter(g=>g!==f && g.status!=='skip').sort((a,b)=>(a.order??0)-(b.order??0)).slice(0,2);
  const back = rest.map((g,i)=>`<span class="fan f${i+2}">${discHTML(g, Math.round(size*.9))}</span>`).join('');
  return `<span class="tile-art" aria-hidden="true">${back}<span class="fan f1 ${f.status==='playing'?'playing':''}" style="${progStyle(c)}">${discHTML(f, size)}</span></span>`;
}
const tbar = c => c.n ? `<span class="tbar" aria-hidden="true"><i class="b" style="width:${c.b/c.n*100}%"></i><i class="pl" style="width:${c.pl/c.n*100}%"></i><i class="h" style="width:${c.hold/c.n*100}%"></i></span>` : '';
function viewShelf(){
  if (!games.length) return empty('Your shelf is empty');
  const byConsole = groupMode === 'console';
  const subFn = byConsole ? (g => g.series?.trim() || '') : subOf;
  const groups = groupBy(byConsole ? consolesOf : seriesOf, sortMode);
  const open = openSeries && groups.find(([n]) => groupMode + ':' + n === openSeries);
  if (openSeries && !open) openSeries = null;

  if (open){
    const [name, list] = open, c = counts(list), key = openSeries;
    const { subs, loose } = groupSubs(list, subFn);
    const ordered = [...subs.flatMap(([,sl])=>sl), ...loose];
    let body;
    if (!subs.length) body = discRow(loose, key+'|');
    else {
      const tabsList = [['*', 'All', ordered], ...subs.map(([n,l])=>[n,n,l]), ...(loose.length ? [['~', byConsole ? 'Standalone' : 'Other', loose]] : [])];
      const cur = tabsList.some(([id]) => id === subPick[key]) ? subPick[key] : '*';
      const tabs = tabsList.map(([id, label, l]) => { const sc = counts(l), done = id !== '*' && sc.n && sc.b === sc.n;
        return `<button class="sub-tab ${done?'done':''}" data-sub="${esc(id)}" data-subkey="${esc(key)}" aria-pressed="${cur===id}">${esc(label)}<small>${sc.b}/${sc.n}</small></button>`; }).join('');
      body = `<div class="sub-tabs" role="group" aria-label="${byConsole?'Series':'Sub-series'}">${tabs}</div>` + discRow(tabsList.find(([id]) => id === cur)[2], key+'|'+cur);
    }
    const stat = (n, cls, label) => n ? `<span class="sd-stat"><span class="dot ${cls}"></span>${n} ${label}</span>` : '';
    return `<button class="sd-back" data-back>‹ All ${byConsole ? 'consoles' : 'series'}</button>
      <div class="sd-head glass">${fanArt(list, 110)}
        <div class="sd-info"><h2>${esc(name)}</h2>
          <span class="tile-meta"><span><b>${c.b}</b> of ${c.n} beaten</span>${c.n && c.b===c.n ? '<span class="done-badge">Complete</span>' : ''}</span>

/* Spin */
function chainOf(g){
  const ser = g.series?.trim(); if (!ser) return null;
  if (subOf(g)) return games.filter(x => seriesOf(x)===ser && subOf(x)===subOf(g));
  return games.some(x => seriesOf(x)===ser && subOf(x)) ? null : games.filter(x => seriesOf(x)===ser);
}
function isNextUp(g){
  const chain = chainOf(g); if (!chain) return true;
  return [...chain].sort((a,b)=>(a.order??0)-(b.order??0)).find(x => !['beaten','dropped','skip'].includes(x.status)) === g;
}
const spinCandidates = () => games.filter(g => g.status==='backlog' && (spinConsole==='all' || onConsole(g, spinConsole)) &&
  (spinSeries==='all' || seriesOf(g)===spinSeries) && (spinTag==='all' || hasTag(g, spinTag)) && (!spinOwned || g.own==='physical' || g.own==='digital'));
function spinPool(){ const c = spinCandidates(); return spinInOrder ? c.filter(isNextUp) : c; }
function viewSpin(){
  const backlog = games.filter(g=>g.status==='backlog');
  if (!backlog.length) return empty('Nothing to spin yet', 'Add games as Want to play and they will show up here.');
  const cs = [...new Set(backlog.flatMap(consolesOf))].sort(), ss = [...new Set(backlog.map(seriesOf))].sort();
  const ts = [...new Set(backlog.flatMap(tagsOf))].sort();
  const sel = (id, cur, all, opts) => `<select id="${id}">${[['all', all], ...opts.map(o=>[o,o])].map(([v,l])=>`<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  const pool = spinPool(), held = spinInOrder ? spinCandidates().length - pool.length : 0;
  if (spinResult && !games.includes(spinResult)) spinResult = null;
  const disc = spinResult ? discHTML(spinResult, 190) : `<span class="cd gen" style="--s:190px;--h:195"></span>`;
  const r = spinResult;
  const result = r && !spinning ? `<div class="result"><span class="t">${esc(r.title)}</span>
      <span class="m">${esc([seriesOf(r) !== STANDALONE ? seriesOf(r) : '', r.platform].filter(Boolean).join(', ') || 'Up next')}</span>
      <div class="btns">${r.status==='backlog' ? `<button class="mini-btn go" data-quick="${r.id}" data-to="playing">Start playing</button>` : ''}<button class="mini-btn" data-game="${r.id}">View game</button></div></div>` : '';
  return `<div class="spin-wrap glass">
    <div class="spin-filters">${sel('spinConsole', spinConsole, 'Any console', cs)}${sel('spinSeries', spinSeries, 'Any series', ss)}${ts.length ? sel('spinTag', spinTag, 'Any tag', ts) : ''}</div>
    <label class="check-row"><input type="checkbox" id="spinOwned" ${spinOwned?'checked':''}>Only games I own</label>

    <p class="pool">${pool.length} game${pool.length===1?'':'s'} in the spin${held ? `, ${held} sequel${held===1?'':'s'} waiting on earlier games` : ''}</p>
    <button class="aqua spin-btn" id="spinBtn" ${pool.length && !spinning ? '' : 'disabled'}>${spinResult ? 'Spin again' : 'Spin'}</button>
    ${result}</div>`;
}
function doSpin(){
  const pool = spinPool(); if (!pool.length || spinning) return;
  const opts = pool.length > 1 ? pool.filter(g=>g!==spinResult) : pool, pick = opts[Math.floor(Math.random()*opts.length)];
  spinning = true; spinAngle += 1440 + Math.floor(Math.random()*360);
  const el = $('spinDisc'), btn = $('spinBtn');
  if (btn) btn.disabled = true;
  document.querySelector('.result')?.remove();
  if (el) el.style.transform = `rotate(${spinAngle}deg)`;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => { spinning = false; spinResult = pick; if (tab==='spin') render(); }, reduce ? 0 : 3300);
}

    ${chips([['all','All years'], ...years.map(y=>[String(y), String(y)])], 'data-tly', String(tlYear))}
    <p class="tl-sum"><b>${nb}</b> beaten${ng ? `, <b>${ng}</b> at 100%` : ''}${nr ? `, <b>${nr}</b> replay${nr===1?'':'s'}` : ''}${tlYear==='all' ? ' all time' : ` in ${tlYear}`}</p>
    <div class="hist">${hist}</div></div>
    ${chips([['all','Everything'],['beat','Beaten'],['gold','100%'],['replay','Replays']], 'data-tlf', tlFilter)}`;
  if (!shown.length) return top + empty('Nothing here', 'Try another year or filter.');

  // Newest first, grouped by month, cards alternating sides of the line
  const desc = [...shown].reverse();
  let html = '', curM = '', side = 0;
  desc.forEach(e => {
    const d = new Date(e.t), mk = `${d.getFullYear()}-${d.getMonth()}`;
    if (mk !== curM){
      curM = mk; const cnt = desc.filter(x => { const xd = new Date(x.t); return `${xd.getFullYear()}-${xd.getMonth()}` === mk; }).length;
      html += `<span class="tl-mpill" id="tlm-${mk}">${esc(d.toLocaleDateString(undefined,{month:'long', year:'numeric'}))}<small>${cnt}</small></span>`;
    }
    if (e.mile && tlFilter !== 'replay') html += `<span class="tl-mile">★ ${esc(e.mile)}</span>`;
    if (e.goldMile && tlFilter !== 'replay') html += `<span class="tl-mile gold">★ ${esc(e.goldMile)}</span>`;
    const g = e.g, label = e.kind==='gold' ? '100%' : e.kind==='replay' ? 'Replay' : 'Beaten';
    const more = [g.rating ? `<span class="stars">${starStr(g.rating)}</span>` : '', esc([g.platform, g.hours ? fmtH(g.hours) : '', seriesOf(g)!==STANDALONE ? seriesOf(g) : ''].filter(Boolean).join(', '))].filter(Boolean).join(' ');
    html += `<div class="tl-node ${side++ % 2 ? 'right' : 'left'} ${e.kind}">
      <span class="tl-disc">${discHTML(g, 46)}</span>
      <div class="tl-card glass" data-tlk="${esc(e.key)}" role="button" tabindex="0" aria-expanded="false">
        <span class="tl-kind">${label}</span><span class="t">${esc(g.title)}</span><span class="m">${esc(fmtDate(e.t))}</span>
        <div class="tl-more">${more}${tagChips(g)}${g.notes ? `<p>${esc(g.notes)}</p>` : ''}<button class="mini-btn" data-game="${g.id}">Open</button></div>
      </div></div>`;
  });
  return top + `<div class="tl2" id="tl2">${html}</div>`;
}
function initTimeline(){
  const box = $('tl2'); if (!box || typeof IntersectionObserver === 'undefined') return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const io = new IntersectionObserver(entries => entries.forEach(en => { if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }), { rootMargin:'0px 0px -8% 0px' });

function readCover(file){
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onerror = () => rej(new Error('read'));
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        try{
          const H = 260, s = H / img.naturalHeight, w = img.naturalWidth * s, cw = Math.min(w, 260);
          const c = document.createElement('canvas'); c.width = Math.round(cw); c.height = H;
          c.getContext('2d').drawImage(img, (cw - w) / 2, 0, w, H);
          res(c.toDataURL('image/jpeg', 0.7));
        }catch(err){ rej(err); }
      };
      img.onerror = () => rej(new Error('decode'));
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- App: Now Playing ---------- */
function appPlayer(){
  const playing = games.filter(g=>g.status==='playing').sort((a,b)=>(b.startedAt||0)-(a.startedAt||0));
  const idx = Math.max(0, playing.findIndex(g=>g.id===homePick)), cur = playing[idx];
  const owned = g => g.own==='physical' || g.own==='digital';
  const queue = games.filter(g=>g.status==='backlog' && isNextUp(g)).sort((a,b)=>(owned(b)-owned(a)) || (a.order??0)-(b.order??0)).slice(0, 25);
  const hold = games.filter(g=>g.status==='hold');
  const head = cur ? `<div class="np-main"><span class="np-art on">${discHTML(cur, 150)}</span>
      <div style="min-width:0"><span class="eyebrow">Now playing${playing.length > 1 ? `, ${idx+1} of ${playing.length}` : ''}</span><h2>${esc(cur.title)}</h2>
        <span class="m">${esc([seriesOf(cur)!==STANDALONE ? seriesOf(cur) : '', cur.platform].filter(Boolean).join(', '))}</span>

        <div class="np-ctl">
          <button class="btn round" data-ptrack="-1" aria-label="Previous game" ${playing.length < 2 ? 'disabled' : ''}>${ICONS.prev}</button>
          <button class="btn round primary" data-quick="${cur.id}" data-to="hold" aria-label="Pause">${ICONS.pause}</button>
          <button class="btn round" data-ptrack="1" aria-label="Next game" ${playing.length < 2 ? 'disabled' : ''}>${ICONS.next}</button>
          <button class="btn" data-hour="${cur.id}">+1h</button>
          <button class="btn" data-quick="${cur.id}" data-to="beaten">${ICONS.check}Beaten</button>
          <button class="btn" data-game="${cur.id}">Details</button></div></div></div>`
    : `<div class="np-main"><span class="np-art"><span class="cd gen" style="--s:150px;--h:195;opacity:.55"></span></span>
      <div><span class="eyebrow">Now playing</span><h2>Nothing in the player</h2><span class="m">Play something from the queue, or spin for one.</span>
        <div class="np-ctl"><button class="btn primary" data-launch="spin">${ICONS.spin}Spin</button></div></div></div>`;
  const row = (g, action) => `<div class="qrow">${discHTML(g, 36)}<span style="min-width:0"><button class="t" data-game="${g.id}">${esc(g.title)}</button>
      <span class="m">${esc([seriesOf(g)!==STANDALONE ? seriesOf(g) : '', g.platform].filter(Boolean).join(', '))}</span></span>${action}</div>`;
  return head + `<div class="qlist">
    ${hold.length ? `<div class="pane-h"><b>On hold</b><span>${hold.length}</span></div>${hold.map(g => row(g, `<button class="btn" data-load="${g.id}">${ICONS.play}Resume</button>`)).join('')}<div style="height:12px"></div>` : ''}

}

/* ---------- App: Library (explorer) ---------- */
function libItems(){
  const [kind, ...rest] = lib.nav.split(':'), val = rest.join(':');
  let list = games, title = 'All games', series = null;
  if (kind === 'st'){ list = games.filter(g=>g.status===val); title = ST[val].long; }
  if (kind === 'series'){ list = games.filter(g=>seriesOf(g)===val); title = val; series = true; }
  if (kind === 'sub'){ const [sr, sb] = val.split('|'); list = games.filter(g=>seriesOf(g)===sr && subOf(g)===sb); title = `${sr}: ${sb}`; series = true; }
  if (kind === 'con'){ list = games.filter(g=>onConsole(g, val)); title = val; }
  if (kind === 'tag'){ list = games.filter(g=>hasTag(g, val)); title = val; }
  const q = lib.q.trim().toLowerCase();
  if (q) list = list.filter(g => [g.title, g.series, g.sub, g.platform, g.notes, ...tagsOf(g)].some(v => v && v.toLowerCase().includes(q)));
  const sort = lib.sort === 'auto' ? (series ? 'order' : 'status') : lib.sort;
  list = [...list].sort((a,b) => sort==='order' ? (a.order??0)-(b.order??0)
    : sort==='title' ? a.title.localeCompare(b.title)
    : sort==='rating' ? (b.rating||0)-(a.rating||0) || a.title.localeCompare(b.title)
    : sort==='hours' ? (b.hours||0)-(a.hours||0) || a.title.localeCompare(b.title)
    : sort==='recent' ? (b.finishedAt||b.startedAt||0)-(a.finishedAt||a.startedAt||0)
    : (LIST_ORDER[a.status]-LIST_ORDER[b.status]) || a.title.localeCompare(b.title));
  return { list, title, kind };
}
function libListHTML(){
  const { list, title, kind } = libItems(), c = counts(list);
  const crumb = `<div class="crumb"><h3>${esc(title)}</h3><span class="m">${list.length} game${list.length===1?'':'s'}${c.n ? `, ${c.b} of ${c.n} beaten` : ''}</span>${['series','sub','con','tag'].includes(kind) ? tbar(c) : ''}</div>`;
  if (!list.length) return crumb + `<div id="libList"><p class="set-note" style="padding:20px 4px">${lib.q ? 'No games match your search.' : 'Nothing here yet.'}</p></div>`;
  const body = lib.view === 'grid'
    ? `<div class="fgrid">${list.map(g => `<button class="file ${statusCls(g)}" data-game="${g.id}"><span class="cdw">${discHTML(g, 64)}</span><span class="t">${esc(g.title)}</span>
        <span class="m"><span class="dot ${ST[g.status].cls}"></span>${g.complete ? '100%' : ST[g.status].short}</span></button>`).join('')}</div>`
    : `<table class="ftable"><thead><tr><th>Title</th><th>Series</th><th>Console</th><th>Status</th><th>Hours</th><th>Rating</th></tr></thead><tbody>
        ${list.map(g => `<tr data-game="${g.id}"><td><span class="tcell">${discHTML(g, 26)}${esc(g.title)}</span></td><td>${esc(subOf(g) ? `${seriesOf(g)} (${subOf(g)})` : (g.series ? seriesOf(g) : ''))}</td>
          <td>${esc(g.platform || '')}</td><td><span class="dot ${ST[g.status].cls}" style="display:inline-block;margin-right:5px"></span>${g.complete ? '100%' : ST[g.status].short}</td>

    </nav>
    <div class="libmain">
      <div class="libnav-m"><select id="libNavSel" aria-label="Folder">${opts.map(([v,l])=>`<option value="${esc(v)}" ${lib.nav===v?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
      <div class="ltool"><input class="search" id="libQ" type="search" placeholder="Search this folder" value="${esc(lib.q)}" autocomplete="off">
        <select id="libSort" aria-label="Sort">${[['auto','Default order'],['order','Play order'],['title','A to Z'],['rating','Top rated'],['hours','Most played'],['recent','Recent']]
          .map(([k,l])=>`<option value="${k}" ${lib.sort===k?'selected':''}>${l}</option>`).join('')}</select>
        <span class="vt" role="group" aria-label="View"><button data-lview="grid" aria-pressed="${lib.view==='grid'}" aria-label="Icons">${ICONS.grid}</button><button data-lview="list" aria-pressed="${lib.view==='list'}" aria-label="Details">${ICONS.list}</button></span>
        <button class="btn primary" data-launch="add">+ Add</button></div>
      <div id="libArea" style="display:flex;flex-direction:column;min-height:0;flex:1">${libListHTML()}</div>

/* ---------- App: Game properties ---------- */
function chainFor(g){ return games.filter(x => seriesOf(x)===seriesOf(g) && (subOf(g) ? subOf(x)===subOf(g) : !subOf(x))).sort((a,b)=>(a.order??0)-(b.order??0)); }
function appGame(id){
  const g = games.find(x=>x.id===id);
  const fact = (v, l) => v ? `<div><b>${v}</b><span>${l}</span></div>` : '';
  const facts = [fact(g.hours ? fmtH(g.hours) : '0h', 'played'), fact(g.rating ? `<span class="stars" style="font-size:14px">${starStr(g.rating)}</span>` : 'None', 'rating'),
    fact(g.own ? OWN[g.own] : 'Not set', 'owned'),
    fact(g.startedAt && (g.status==='playing'||g.status==='hold') ? esc(fmtDate(g.startedAt)) : '', 'started'),
    fact(g.finishedAt && g.status==='beaten' ? esc(fmtDate(g.finishedAt)) : '', g.complete ? 'beaten at 100%' : 'beaten'),
    fact(clears(g) > 1 ? `×${clears(g)}` : '', 'clears')].join('');
  const chain = g.series?.trim() ? chainFor(g) : [], pos = chain.indexOf(g);
  return `<div class="gp-top">${discHTML(g, 110)}<div style="min-width:0"><span class="eyebrow">${g.complete ? '100% complete' : ST[g.status].long}</span>
      <h2>${esc(g.title)}</h2><span class="m">${esc([g.series ? (subOf(g) ? `${seriesOf(g)} (${subOf(g)})` : seriesOf(g)) : 'Standalone', g.platform].filter(Boolean).join(', '))}</span>${tagChips(g)}</div></div>
    <fieldset class="group"><legend>Status</legend><div class="gp-status">${Object.keys(ST).map(k=>`<button data-setstatus="${k}" data-gid="${g.id}" aria-pressed="${g.status===k}">${ST[k].long}</button>`).join('')}</div></fieldset>
    <fieldset class="group"><legend>Details</legend><div class="facts">${facts}</div></fieldset>
    ${chain.length > 1 ? `<fieldset class="group"><legend>Play order</legend><div class="order-row"><span>${pos+1} of ${chain.length} in ${esc(subOf(g) || seriesOf(g))}</span>
      <button class="btn" data-gmove="-1" data-gid="${g.id}" ${pos===0?'disabled':''}>Earlier</button><button class="btn" data-gmove="1" data-gid="${g.id}" ${pos===chain.length-1?'disabled':''}>Later</button></div></fieldset>` : ''}
    ${g.notes ? `<fieldset class="group"><legend>Notes</legend><div class="gp-notes">${esc(g.notes)}</div></fieldset>` : ''}
    <div class="gp-actions">${g.status==='playing' ? `<button class="btn" data-hour="${g.id}">+1 hour</button>` : ''}
      ${g.status==='backlog' || g.status==='hold' ? `<button class="btn" data-load="${g.id}">${ICONS.play} Play now</button>` : ''}
      <button class="btn primary" data-id="${g.id}">Edit</button></div>
    <p class="set-note" style="text-align:center;margin-top:14px">Tap outside to close</p>`;
}
