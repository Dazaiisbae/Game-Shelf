  .dn-e{font-size:clamp(9px,2.8vh,14px)}
  .dn h1{font-size:clamp(16px,7vh,40px);margin:.6vh 0}
  .dn-m{font-size:clamp(10px,3.4vh,17px)}
  .dn .d-tbtn,.dn .d-timer{margin-top:2.4vh}
  .d-timer{gap:1.6vw;padding:1.2vh 1.2vh 1.2vh 2.4vh}
  .d-timer b{font-size:clamp(18px,8vh,48px)}
  .d-tbtn{font-size:clamp(12px,3.6vh,18px);padding:1.4vh 2.6vw}
  .d-tdot{width:2.6vh;height:2.6vh;min-width:8px;min-height:8px}
  .d-side{gap:1.6vh}
  .dc{padding:2.6vh 2.4vw;border-radius:2.6vh}
  .dc-h{margin-bottom:1.6vh;font-size:clamp(9px,2.8vh,14px)}
  .dc-stats{gap:1.4vh 2vw}
  .dc-stats b{font-size:clamp(18px,8vh,42px)}
  .dc-stats span{font-size:clamp(9px,2.8vh,14px)}
  .dc-discs{gap:1.4vh 2vw}
  .dc-discs .cd{--s:min(64px,11vh) !important;width:min(64px,11vh) !important;height:min(64px,11vh) !important}
  .dc-discs span{font-size:clamp(9px,2.8vh,14px)}
  .dc-discs small{font-size:clamp(8px,2.4vh,12px)}
  .dc-goal{font-size:clamp(11px,3.4vh,18px)}
  .dring{width:min(110px,22vh);height:min(110px,22vh)}
  .dring b{font-size:clamp(14px,6vh,32px)}
  .dc-bar{font-size:clamp(10px,3vh,16px);margin:1vh 0}
  .dc-pick .cd{--s:min(80px,15vh) !important;width:min(80px,15vh) !important;height:min(80px,15vh) !important}
  .dc-pick b{font-size:clamp(13px,4.4vh,24px)}
  .d-hint{bottom:1.5vh;font-size:11px}
  .d-exit{bottom:3vh;padding:10px 20px;font-size:14px}}
/* very short screens (like a sideways phone with browser bars): hide the extras and keep the essentials */
@media (max-height:360px) and (orientation:landscape){
  .d-dots,.d-brand{display:none}
  .dc-discs > div:nth-child(n+3){display:none}
  .dc-discs{grid-template-columns:repeat(2,1fr)}}
/* ===== Play timer ===== */
.tm-pill{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--tb,56px) + 12px);z-index:60;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);
  padding:6px 6px 6px 14px;border-radius:999px;color:#fff;background:linear-gradient(180deg,rgba(30,40,70,.92),rgba(12,18,36,.92));border:1px solid rgba(255,255,255,.3);
  box-shadow:0 10px 30px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);animation:pop .25s ease-out}
.tm-dot{flex:0 0 10px;width:10px;height:10px;border-radius:50%;background:#FF4D6D;box-shadow:0 0 8px #FF4D6D;animation:tmBlink 1.4s ease-in-out infinite}
@keyframes tmBlink{50%{opacity:.35}}
.tm-t{border:0;background:none;color:#fff;font:inherit;font-weight:800;font-size:13px;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0}
.tm-pill b{font-variant-numeric:tabular-nums;font-size:15px}
.tm-stop{padding:7px 14px;color:#fff !important;background:#D9465A !important;border-color:#D9465A !important}
.tm-on{color:#fff !important;background:#D9465A !important;border-color:#D9465A !important}
.tm-ov{position:absolute;inset:0;z-index:9950;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,15,35,.55);animation:pop .2s ease-out}
.tm-card{width:min(340px,100%);padding:20px;border-radius:20px;text-align:center;color:var(--ink);background:var(--win-bg);border:1px solid var(--edge);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.tm-e{margin:0;font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.tm-card h2{margin:4px 0 6px;font-size:19px;overflow-wrap:anywhere}
.tm-big{margin:0 0 10px;font-size:32px;font-weight:900}
.tm-step{display:flex;align-items:center;justify-content:center;gap:16px;margin:0 0 14px;font-size:15px}
.tm-step b{font-size:24px}
@media (prefers-reduced-motion:reduce){ .tm-dot{animation:none}}
/* ===== Play calendar ===== */
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-h h3{margin:0}
.cal-y{display:flex;align-items:center;gap:8px}
.cal-y .btn.round{width:30px;height:30px;padding:0}
.cal-scroll{overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.cal-months{display:grid;grid-template-columns:repeat(54,14px);gap:3px;font-size:10px;font-weight:800;color:var(--soft);height:14px;width:max-content}
.cal-months span{white-space:nowrap}
.cal-grid{display:flex;gap:3px;width:max-content}
.cw{display:flex;flex-direction:column;gap:3px}
.cz{display:block;width:14px;height:14px;border-radius:3px;border:0;padding:0;background:var(--pane-line)}
.cz.out{visibility:hidden}
.cz.lf{opacity:.35}
.cz.l1{background:#BFEFFF}.cz.l2{background:#7FD3F5}.cz.l3{background:#A98BFF}.cz.l4{background:#FF7FC8;box-shadow:0 0 6px rgba(255,127,200,.6)}
.cz.pick{outline:2px solid var(--ink);outline-offset:1px}
.cal-pick{margin:8px 0 10px;font-size:13px;font-weight:700;color:var(--soft);min-height:18px}
.cal-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cal-stats div{padding:8px 4px;border-radius:10px;text-align:center;background:var(--tint);border:1px solid var(--edge)}
.cal-stats b{display:block;font-size:17px;font-weight:900}
.cal-stats span{font-size:10px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.cal-key{display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:8px;font-size:10px;font-weight:700;color:var(--soft)}
.cal-key span{margin:0 4px}
.cal-key .cz{width:11px;height:11px}
/* ===== Money ===== */
.mn-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mn-row .d-l{flex:1 0 100%}
.mn-in{flex:1;display:flex;align-items:center;gap:4px;padding:0 12px;border-radius:12px;background:var(--field);border:1px solid var(--edge)}
.mn-in span{font-weight:900;color:var(--soft)}
.mn-in input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;font-weight:800;padding:10px 0;color:var(--ink);outline:none}
.mn-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--pane-line);font-size:14px;font-weight:700}
.mn-line .t{border:0;background:none;color:inherit;font:inherit;text-align:left;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mn-line span{flex:0 0 auto;color:#2FBF8F;font-weight:900}
#mnCur{margin:0;width:auto;padding:6px 26px 6px 10px;border-radius:999px;font-size:13px}
/* ===== Background music ===== */
.mus-btn{display:inline-flex;align-items:flex-end;justify-content:center;gap:2px;width:34px;height:30px;margin-left:8px;padding:6px 7px;border-radius:999px;border:1px solid var(--edge);background:var(--field);cursor:pointer}
.mus-btn i{display:block;width:3px;height:6px;border-radius:2px;background:var(--soft)}
.mus-btn.on{background:linear-gradient(180deg,#6CC6F5,#2E9BE0);border-color:rgba(255,255,255,.6)}
.mus-btn.on i{background:#fff;animation:eq .9s ease-in-out infinite}
.mus-btn.on i:nth-child(2){animation-delay:.2s}.mus-btn.on i:nth-child(3){animation-delay:.45s}.mus-btn.on i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:5px}50%{height:15px}}
.stations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.stations button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:12px;border:2px solid transparent;background:var(--field);color:inherit;font:inherit;text-align:left}
.stations button[aria-pressed=true]{border-color:var(--accent);background:var(--tint)}
.stations b{font-size:14px;font-weight:900}
.stations small{font-size:12px;color:var(--soft);font-weight:600}
@media (prefers-reduced-motion:reduce){ .mus-btn.on i{animation:none;height:10px}}
/* ===== Seasonal themes ===== */
#seasonFx{position:absolute;inset:0;width:100%;height:100%;z-index:55;pointer-events:none}
.season-badge{font-size:18px;margin-left:8px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
/* a soft seasonal glow at the top of the screen */
:root[data-season] #os::after{content:"";position:absolute;left:0;right:0;top:0;height:40vh;z-index:0;pointer-events:none;opacity:.55}
:root[data-season=winter] #os::after,:root[data-season=holidays] #os::after{background:radial-gradient(ellipse at 50% 0,rgba(220,240,255,.75),transparent 70%)}
:root[data-season=spring] #os::after{background:radial-gradient(ellipse at 50% 0,rgba(255,196,221,.6),transparent 70%)}
:root[data-season=summer] #os::after{background:radial-gradient(ellipse at 80% 0,rgba(255,226,122,.6),transparent 65%)}
:root[data-season=autumn] #os::after{background:radial-gradient(ellipse at 50% 0,rgba(242,140,60,.45),transparent 70%)}
:root[data-season=halloween] #os::after{background:radial-gradient(ellipse at 50% 0,rgba(140,70,220,.5),transparent 70%),radial-gradient(ellipse at 80% 10%,rgba(255,140,40,.35),transparent 50%)}
:root[data-season=valentine] #os::after{background:radial-gradient(ellipse at 50% 0,rgba(255,127,176,.55),transparent 70%)}
:root[data-season=newyear] #os::after{background:radial-gradient(ellipse at 50% 0,rgba(255,233,138,.5),transparent 70%)}
/* holiday string lights along the top bar */
:root[data-season=holidays] .stage-h{position:relative}
:root[data-season=holidays]:not([data-slvl=normal]):not([data-slvl=festive]) .stage-h::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:12px;pointer-events:none;
  background:radial-gradient(circle at 10px 6px,#FF5E6A 0 3.5px,transparent 4.5px) 0 0/80px 12px repeat-x,radial-gradient(circle at 30px 6px,#FFD34D 0 3.5px,transparent 4.5px) 0 0/80px 12px repeat-x,
    radial-gradient(circle at 50px 6px,#5FD38A 0 3.5px,transparent 4.5px) 0 0/80px 12px repeat-x,radial-gradient(circle at 70px 6px,#6FB8FF 0 3.5px,transparent 4.5px) 0 0/80px 12px repeat-x;
  filter:drop-shadow(0 0 3px rgba(255,230,150,.8))}
/* a little snow cap in winter */
:root[data-season=winter] .stage-h{position:relative}
:root[data-season=winter]:not([data-slvl=normal]):not([data-slvl=festive]) .stage-h::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:9px;pointer-events:none;
  background:radial-gradient(circle at 9px 0,#fff 0 8px,transparent 8.5px) 0 0/22px 9px repeat-x;opacity:.9;filter:drop-shadow(0 1px 1px rgba(0,40,90,.15))}
.seasons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seasons button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;border:2px solid transparent;background:var(--field);color:inherit;font:inherit}
.seasons button[aria-pressed=true]{border-color:var(--accent);background:var(--tint)}
.se-i{font-size:22px;line-height:1.2}
.seasons b{font-size:13px;font-weight:800}
.seasons small{font-size:10px;color:var(--soft);font-weight:700}
.hint{display:block;margin-top:4px;font-size:11px;font-weight:600;color:var(--soft)}
.tm-step .btn{min-width:96px}
.mus-btn .mus-note{width:16px;height:16px;color:var(--soft)}
.mus-btn i{display:none}
.mus-btn.on .mus-note{display:none}
.mus-btn.on i{display:block}
.mus-btn{align-items:center}
.mus-btn.on{align-items:flex-end}
/* ===== Timer on Display mode ===== */
.d-timer{display:inline-flex;align-items:center;gap:2.4vmin;margin-top:2.6vmin;padding:1.6vmin 1.6vmin 1.6vmin 3vmin;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.d-timer b{font-size:clamp(26px,6.5vmin,64px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em;text-shadow:0 0 18px rgba(255,120,140,.5)}
.d-tdot{width:1.8vmin;height:1.8vmin;min-width:10px;min-height:10px;border-radius:50%;background:#FF4D6D;box-shadow:0 0 10px #FF4D6D;animation:tmBlink 1.4s ease-in-out infinite}
.d-tbtn{display:inline-block;margin-top:2.6vmin;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.16);color:#fff;font:inherit;font-weight:800;font-size:clamp(15px,2.6vmin,24px);padding:1.8vmin 4vmin;border-radius:999px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.d-timer .d-tbtn{margin:0}
.d-tbtn.stop{background:#D9465A;border-color:#D9465A}
.tm-ov.over-display{position:fixed;z-index:100001}
.dn-m{display:block}
.dn .d-tbtn,.dn .d-timer{margin-top:2.6vmin}
.d-tbtn{white-space:nowrap;flex:0 0 auto}

/* Timer buttons: a crisp drawn icon, centered with the label */
.d-tbtn,.tm-on,.tm-go,.tm-stop{display:inline-flex;align-items:center;justify-content:center;gap:.45em;line-height:1}
.d-tbtn .bi,.tm-on .bi,.tm-go .bi{width:1em;height:1em;flex:0 0 auto}
.d-tbtn span,.tm-on span,.tm-go span{display:block;line-height:1}
.d-timer{align-items:center}
.d-tbtn.stop{padding:1.4vmin 3.4vmin;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px rgba(217,70,90,.4)}

/* Timer pause */
.tm-pz{display:inline-flex;align-items:center;justify-content:center;gap:.45em;line-height:1}
.tm-pz .bi{width:1em;height:1em}
.tm-pill .tm-pz{padding:7px 12px;color:#fff !important;background:rgba(255,255,255,.18) !important;border-color:rgba(255,255,255,.35) !important}
.tm-pill .tm-pz span{display:none}
.tm-pill.paused .tm-dot{background:#F2C14E;box-shadow:0 0 8px #F2C14E;animation:none}
.tm-pill.paused #tmClock{opacity:.7}
.d-timer.paused .d-tdot{background:#F2C14E;box-shadow:0 0 10px #F2C14E;animation:none}
.d-timer.paused b{opacity:.7;text-shadow:none}
.d-tbtn.pause,.d-tbtn.resume{background:rgba(255,255,255,.16)}
.d-tbtn.resume{background:#2FBF8F;border-color:#2FBF8F}
.d-timer{flex-wrap:wrap;justify-content:center}

/* photo wallpaper */
:root[data-wall=photo] #os{background:linear-gradient(rgba(0,0,0,var(--wdim,.2)),rgba(0,0,0,var(--wdim,.2))),var(--wphoto) center/cover no-repeat !important}
.wp-photo{display:flex !important;align-items:center;justify-content:center;font-style:normal;font-size:26px;font-weight:300;color:var(--soft);background:var(--field) center/cover no-repeat;border:2px dashed var(--pane-line)}
.wp-photo[style]{border-style:solid;border-color:rgba(255,255,255,.7)}
.wp-photo-opts{margin-top:12px}
/* ===== Display mode music visualizer ===== */
.d-viz{position:absolute;left:0;right:0;bottom:0;height:22vh;width:100%;z-index:1;pointer-events:none;opacity:.55;-webkit-mask:linear-gradient(transparent,#000 40%);mask:linear-gradient(transparent,#000 40%)}
.display .d-drift{z-index:2}
.d-mus{position:absolute;right:max(4vmin,env(safe-area-inset-right));bottom:max(3vmin,env(safe-area-inset-bottom));z-index:3;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;
  border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-weight:800;font-size:13px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer}
.d-mus .bi{width:14px;height:14px}
.d-mus.on{background:linear-gradient(180deg,rgba(108,198,245,.6),rgba(46,155,224,.6))}
/* ===== Display sleep ===== */
.display.sleeping{background:#000 !important}
.display.sleeping > *{opacity:0 !important;transition:opacity 1.5s}
.display.sleeping::before,.display.sleeping::after{opacity:0 !important}
.dsched .search{margin:4px 0 0;width:100%;padding:9px 12px}

@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}

/* Segmented buttons and two-column rows used by newer panels */

.gf-seg.wrap{flex-wrap:wrap}
.gf-seg button{flex:1 0 auto;padding:9px 10px;border-radius:999px;border:1px solid var(--edge);background:var(--field);color:inherit;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.gf-seg button[aria-pressed=true]{color:#fff;background:linear-gradient(180deg,#6CC6F5,#2E9BE0 50%,#1F86CC 51%,#3AA8EA);border-color:rgba(255,255,255,.6)}

/* the "From photos" wallpaper tile is always available, even with Extra looks off */


.walls button[data-wallphoto] i.wp-photo{width:100%;align-self:stretch}

  background:var(--win-bg);border:1px solid var(--edge);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 12px 30px rgba(0,20,50,.3);animation:pop .3s ease-out}

.gear-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}

.gtag.wish{background:rgba(180,156,255,.2);border-color:rgba(180,156,255,.5)}

.gear-soldbtn{display:block;margin:16px auto 8px;color:var(--aqua-deep)}
.gear-ov{align-items:flex-end}

.gf-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}

.gf-scroll{overflow:auto;padding:0 16px 8px;-webkit-overflow-scrolling:touch}

#stageBody{padding-bottom:calc(96px + env(safe-area-inset-bottom)) !important}
#seasonDeco{bottom:0 !important;z-index:53}
.taskbar{z-index:9000}
.stage-h{border-bottom:1px solid rgba(255,255,255,.75) !important}
/* ===== Cooler pill bars: holo rims, glossy sheen, a light sweep, a spinning holo orb, jelly active tab ===== */
.stage-h,.taskbar{border:1.6px solid transparent !important;
  background:linear-gradient(180deg,rgba(255,255,255,.68),rgba(255,255,255,.40)) padding-box,
             linear-gradient(100deg,#9FF0FF,#C9B8FF 25%,#FFC4E8 50%,#FFF0B0 75%,#B8FFE0) border-box !important}
@media (prefers-color-scheme:dark){ .stage-h,.taskbar{background:linear-gradient(180deg,rgba(44,76,130,.68),rgba(14,28,58,.62)) padding-box,
             linear-gradient(100deg,rgba(127,231,255,.75),rgba(180,156,255,.75) 25%,rgba(255,159,216,.75) 50%,rgba(255,233,138,.7) 75%,rgba(140,255,201,.7)) border-box !important}}
/* glossy top sheen plus a soft light sweep every few seconds */
.stage-h::before,.taskbar::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 48%,transparent 52%),
             linear-gradient(105deg,transparent 42%,rgba(255,255,255,.55) 50%,transparent 58%);
  background-size:100% 100%,260% 100%;background-repeat:no-repeat;background-position:0 0,140% 0;animation:barSweep 9s ease-in-out infinite}
.taskbar::before{animation-delay:1.2s}
@media (prefers-color-scheme:dark){ .stage-h::before,.taskbar::before{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.02) 48%,transparent 52%),linear-gradient(105deg,transparent 42%,rgba(255,255,255,.22) 50%,transparent 58%);background-size:100% 100%,260% 100%;background-repeat:no-repeat}}
@keyframes barSweep{0%,62%{background-position:0 0,140% 0}82%,100%{background-position:0 0,-40% 0}}
.stage-h > *,.taskbar > *{position:relative;z-index:1}
/* the tab icon is a holo disc that slowly turns */
.stage-h .ti{background:none !important;overflow:hidden;isolation:isolate}
.stage-h .ti::before{content:"";position:absolute;inset:-20%;z-index:-1;background:conic-gradient(from 0deg,#5FD8FF,#9B7BFF,#FF7FC8,#FFE066,#5FF2B0,#5FD8FF);animation:orbTurn 12s linear infinite}
.stage-h .ti::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:50%;background:radial-gradient(circle at 35% 26%,rgba(255,255,255,.8),transparent 46%)}
@keyframes orbTurn{to{transform:rotate(360deg)}}
/* the live number gets a glossy little capsule */
.hdr-chip{background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.5)) !important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 1px 3px rgba(0,40,90,.12) !important;color:var(--ink) !important}
@media (prefers-color-scheme:dark){ .hdr-chip{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08)) !important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22) !important;color:#EAF4FF !important}}
/* the active tab is a glossy jelly pill with a soft glow */
.taskbar .task.cur{position:relative;overflow:hidden}
.taskbar .task.cur::before{content:"";position:absolute;left:8%;right:8%;top:3px;height:46%;border-radius:16px 16px 10px 10px;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.05));pointer-events:none}
.taskbar .task.cur{box-shadow:0 6px 16px rgba(30,110,200,.35),0 0 18px rgba(127,231,255,.35),inset 0 -2px 4px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.7) !important}
.taskbar .task .ti{transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.taskbar .task:active .ti{transform:scale(.82)}
.taskbar .task.cur .ti{animation:tabPop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes tabPop{0%{transform:scale(.7)}100%{transform:none}}
/* calmer when Reduce effects or Reduce Motion is on */
:root[data-lite] .stage-h::before,:root[data-lite] .taskbar::before,:root[data-lite] .stage-h .ti::before{animation:none}
@media (prefers-reduced-motion:reduce){ .stage-h::before,.taskbar::before,.stage-h .ti::before,.taskbar .task.cur .ti{animation:none}}

/* lots of tabs in the bar: icons only, so everything fits */
.taskbar[data-many] .task .lbl{display:none !important}
.taskbar[data-many] .task{min-width:0 !important;flex:1 1 0 !important;height:48px !important;padding:0 !important;justify-content:center}
.taskbar[data-many] .task .ti{width:23px;height:23px}

/* Now Playing card corner buttons: real round glass buttons with clear white icons */
.np2-nav .btn.round{width:34px !important;height:34px !important;min-width:34px;padding:0 !important;border-radius:50% !important;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(10,25,55,.28) !important;border:1px solid rgba(255,255,255,.6) !important;color:#fff !important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:0 3px 8px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.45) !important}
.np2-nav .btn.round svg{width:16px !important;height:16px !important;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.np2-nav .btn.round:active{transform:scale(.92)}
.np2-nav .btn.round[disabled]{opacity:.45}
/* dock disc: hidden unless a session is running, then it spins with a soft pulse */
#tray .mini-np{display:none !important}
:root[data-live] #tray .mini-np{display:inline-flex !important;position:relative;animation:livePop .35s cubic-bezier(.3,1.6,.5,1)}
:root[data-live] #tray .mini-np .cd{animation:spin 4s linear infinite}
:root[data-live] #tray .mini-np::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #FF5E99;animation:livePulse 2s ease-out infinite;pointer-events:none}
@keyframes livePop{from{transform:scale(.4);opacity:0}}
@keyframes livePulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
:root[data-lite] #tray .mini-np .cd,:root[data-lite] #tray .mini-np::after{animation:none}
@media (prefers-reduced-motion:reduce){ :root[data-live] #tray .mini-np .cd,:root[data-live] #tray .mini-np::after{animation:none}}

/* phones: the page frame has no edge or shine line, so nothing white shows at the very top of the screen */
@media (max-width:759px){ .stage{border:0 !important;box-shadow:none !important;border-radius:0 !important}}
/* ===== Now Playing lists as tidy glass panels ===== */
.qlist{display:flex;flex-direction:column;gap:14px}
.qsec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 6px !important}
.qsec-h b{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.qsec-h span{font-size:11px;font-weight:900;padding:2px 9px;border-radius:999px;background:var(--tint);border:1px solid var(--edge);color:var(--soft)}
.qsec-box{border-radius:20px;background:var(--pane);border:1px solid var(--pane-line);overflow:hidden}
.qsec-box .qrow{padding:9px 12px !important;margin:0 !important;border-radius:0 !important;background:none !important;border:0 !important;border-bottom:1px solid var(--pane-line) !important}
.qsec-box .qrow[hidden]{display:none !important}
.qsec-box .qrow .t{font-size:14.5px}
.qsec-box .qplay{padding:7px 12px !important;font-size:12.5px !important}
.qsec-more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;border:0;background:none;color:var(--aqua-deep,#2E7FD0);font:inherit;font-size:13.5px;font-weight:900;cursor:pointer}
.qsec-more span{font-size:11px}
.qsec-box > .qrow:last-of-type{border-bottom:0 !important}
/* ===== Your own Up next ===== */
.up-edit{display:flex;gap:6px;flex:0 0 auto}
.up-edit .btn.round{width:32px;height:32px;padding:0;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.up-edit .up-x{color:#D63A40}
.up-tools{display:flex;justify-content:center;padding:4px 0 2px}
.up-tools .linkbtn{font-size:12.5px;font-weight:800;color:var(--soft)}
.up-empty{margin:0;padding:12px 14px;font-size:13px}
.btn.up-on{background:var(--tint);border-color:var(--accent)}
/* ===== Now Playing, tidied ===== */
.np2-week{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);font-size:12px;font-weight:800}
.np2-days{display:flex;gap:4px;margin-left:auto}
.np2-days i{width:13px;height:13px;border-radius:4px;background:rgba(255,255,255,.22)}
.np2-days i.on{background:linear-gradient(180deg,#9FF0FF,#2E9BE0);box-shadow:0 0 6px rgba(127,231,255,.7)}
.np2-days i.today{outline:1.5px solid rgba(255,255,255,.85);outline-offset:1px}
.np2-games{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.np2-gchip{display:inline-flex;align-items:center;gap:6px;max-width:48%;padding:3px 10px 3px 3px;border-radius:999px;border:0;font:inherit;font-size:11.5px;font-weight:800;color:#fff;background:rgba(255,255,255,.16);cursor:pointer}
.np2-gchip span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.np2-gchip.on{background:rgba(255,255,255,.34);box-shadow:inset 0 0 0 1.5px #fff}
.np2-gchip .cd{flex:0 0 auto}
.np2-empty .np2-ebody{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;margin:8px 0 2px}
.np2-empty .np2-ebody b{font-size:21px;font-weight:900;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.np2-empty .np2-ebody small{font-size:12.5px;font-weight:700;opacity:.9}
.np2-tag{margin-top:6px;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.22)}
.np2-empty .np2-actions{flex-wrap:wrap}.np2-empty .np2-actions .btn:not(.primary){flex:1 1 auto}
.qslim{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:18px;border:1px solid var(--pane-line);background:var(--pane);color:inherit;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;text-align:left}
.qslim-st{display:flex}.qslim-st .cd{margin-left:-9px;box-shadow:0 0 0 2px var(--win-bg)}.qslim-st .cd:first-child{margin-left:0}
.qslim em{margin-left:auto;font-style:normal;font-size:12.5px;font-weight:900;color:var(--aqua-deep,#2E7FD0)}
.qsec-h[hidden],.qsec-box[hidden]{display:none !important}
.qwait{margin:8px;padding:10px 12px;border-radius:16px;background:linear-gradient(135deg,rgba(255,159,216,.2),rgba(180,156,255,.14));border:1px solid rgba(255,159,216,.4)}
.qwait-k{font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#D9468A}
@media (prefers-color-scheme:dark){ .qwait-k{color:#FFB3DA}}
.qwait-m{display:flex;align-items:center;gap:10px;margin-top:6px;cursor:pointer}.qwait-m .cd{flex:0 0 auto}
.qwait-m span{display:flex;flex-direction:column;min-width:0}.qwait-m b{font-size:15px;font-weight:900}.qwait-m small{font-size:12px;font-weight:600;color:var(--soft)}
.qwait-a{display:flex;gap:8px;margin-top:8px}.qwait-a .btn{flex:1;padding:8px}
/* ===== Pick for me ===== */
.qsec-h .pick-btn,.pane-h .pick-btn{margin-left:8px;padding:4px 11px;border-radius:999px;border:1px solid var(--edge);background:var(--pill-accent,linear-gradient(180deg,#6CC6F5,#2E9BE0));color:#fff;font:inherit;font-size:11.5px;font-weight:900;letter-spacing:0;text-transform:none;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.qsec-h{align-items:center !important}.qsec-h > span:not(.pick-btn){margin-left:auto}
.pick-ov{align-items:flex-end}
.pick-box{width:min(460px,100%);max-height:92%;overflow:auto;padding:14px 14px 18px;border-radius:26px 26px 0 0;background:var(--win-bg);border:1px solid var(--edge);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);color:var(--ink);box-shadow:0 -12px 40px rgba(0,20,50,.3);animation:pop .25s ease-out}
.pick-card{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:10px;padding:18px 14px;border-radius:22px;color:#fff;text-align:center;border:1px solid rgba(255,255,255,.6)}
.pick-card.none{color:var(--ink);background:var(--pane);border-color:var(--pane-line)}
.pick-card b{font-size:22px;font-weight:900;text-shadow:0 1px 4px rgba(0,0,0,.35);overflow-wrap:anywhere}
.pick-card small{font-size:13px;font-weight:700;opacity:.92}
.pick-why{padding:3px 11px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.24);margin-top:4px}
.pick-disc{filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
.pick-card.roll .pick-disc{animation:pickSpin .6s cubic-bezier(.2,.8,.3,1)}
.pick-card.roll b,.pick-card.roll .pick-why{animation:pop .45s ease-out}
@keyframes pickSpin{from{transform:rotate(-540deg) scale(.6);opacity:.3}}
.pick-acts{display:flex;gap:8px;margin-top:12px}.pick-acts .btn{flex:1;padding:11px 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pick-acts .bi{width:15px;height:15px}
.pick-filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:14px;padding:10px 12px;border-radius:16px;background:var(--pane);border:1px solid var(--pane-line);font-size:13px;font-weight:700}
.pick-filters select{border-radius:10px;margin:0}
.pick-filters label{display:flex;align-items:center;gap:6px}
@media (prefers-reduced-motion:reduce){ .pick-card.roll .pick-disc{animation:none}}
.ab-head{display:flex;align-items:center;gap:12px}
.ab-disc{width:52px;height:52px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle closest-side,transparent 0 15%,#fff 16% 28%,transparent 29%),conic-gradient(from 200deg,#5FD8FF,#9B7BFF,#FF7FC8,#FFE066,#5FF2B0,#5FD8FF);
  -webkit-mask:radial-gradient(circle closest-side,transparent 0 9%,#000 10%);mask:radial-gradient(circle closest-side,transparent 0 9%,#000 10%);box-shadow:0 3px 10px rgba(0,30,60,.25)}
.ab-head span{display:flex;flex-direction:column}.ab-head b{font-size:18px;font-weight:900}.ab-head small{font-size:12.5px;font-weight:800;color:var(--soft)}
.ab-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.ab-facts div{padding:8px 4px;border-radius:12px;text-align:center;background:var(--tint);border:1px solid var(--edge)}
.ab-facts b{display:block;font-size:17px;font-weight:900}.ab-facts span{font-size:10px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}

/* ===== Better backups ===== */
.file-offscreen{position:fixed;left:-10000px;top:0;width:1px;height:1px;opacity:0}
.bk-loaded{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--tint);border:1px solid var(--edge);font-weight:700;color:var(--ink)}
.bk-status{margin:0;font-size:14px;font-weight:800}
.bk-status.ok{color:#2FBF8F}
.bk-status.warn{color:#E0A21B}
.bk-restore{margin-top:12px;padding:12px;border-radius:12px;background:var(--tint);border:1px solid var(--edge)}
.rmode{display:flex;gap:6px}
.rmode button{flex:1;padding:10px 4px;font-size:13px}
.snaps{display:flex;flex-direction:column;gap:6px}
.snap{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--field);border:1px solid var(--pane-line)}
.snap span{flex:1;min-width:0;display:flex;flex-direction:column}
.snap b{font-size:13px;font-weight:800}
.snap small{font-size:12px;color:var(--soft);font-weight:600}
.danger-btn{color:#fff !important;background:#D9465A !important;border-color:#D9465A !important}
.bk-nudge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:10px 12px;border-radius:14px;font-size:13px;font-weight:700;
  background:linear-gradient(135deg,rgba(255,214,102,.28),rgba(255,214,102,.12));border:1px solid rgba(233,169,32,.5)}
.bk-nudge span{flex:1 1 180px}
.stage-body.flush .bk-nudge{margin:10px 10px 0}
.lib-grid > *,.grid > .tile,.tiles > *,.file,.qrow,.zz-row,.bar-row,.trow2,.tr-g,.snap,.tlx-item{content-visibility:auto;contain-intrinsic-size:auto 90px}

/* Library toolbar: always fits the screen. The search box shrinks instead of pushing buttons off the edge,
   the folder picker shows its full name, and the extra + is gone (the dock already has one). */
.ltool2{width:100%;max-width:100%;box-sizing:border-box;gap:8px}
.lt2-search{flex:1 1 0 !important;min-width:0 !important;width:auto}
.lt2-search input{min-width:0 !important;width:100% !important;box-sizing:border-box}
.ltool2 .lt2-add{display:none !important}
.lt2-folder{flex:0 0 auto !important;max-width:46% !important}
.lt2-folder select{width:auto !important;max-width:100%;padding:9px 26px 9px 12px !important;font-size:13px !important;text-overflow:ellipsis}
/* the list heading under the toolbar is calmer, since the top pill already shows the count */
#stageBody .lib-h h2,#stageBody .lhead h2{font-size:20px}

.ltool2{padding:0 12px !important}
.lt2-pop{margin-left:12px !important;margin-right:12px !important}
.lt2-sorted{margin-left:14px !important}

.ltool2{align-items:center !important}
.lt2-folder{flex:0 0 118px !important;max-width:118px !important;margin:0 !important}
.lt2-folder select{width:100% !important;margin:0 !important;height:38px;padding:0 24px 0 12px !important}
.lt2-search input{height:38px;margin:0 !important}

.lt2-folder{flex:0 0 126px !important;max-width:126px !important;padding:0 !important}
.lt2-folder select{padding:0 22px 0 12px !important;background-position:right 8px center !important}
/* ===== Library, reworked ===== */
.lchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 12px;margin:2px 0 10px}
.lchips::-webkit-scrollbar{display:none}
.lchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;border:1px solid var(--edge);background:var(--pane);color:inherit;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.lchip i{font-style:normal;font-weight:700;opacity:.7}
.lchip.on{color:#fff;background:var(--pill-accent,linear-gradient(180deg,#6CC6F5,#2E9BE0));border-color:rgba(255,255,255,.5)}
.lgrp{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:14px 2px 6px;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.lgrp::after{content:"";flex:1;height:1px;background:var(--pane-line)}
.lgrp .dot{width:8px;height:8px;border-radius:50%}.lgrp i{font-style:normal;opacity:.8}
.fgrid2 > .lgrp:first-child{margin-top:2px}
/* A: compact grid, the ring shows status */
.fgrid.fgrid2{grid-template-columns:repeat(4,minmax(0,1fr)) !important;gap:12px 6px !important}
.fgrid2 .file{padding:4px 2px !important;gap:6px !important;min-width:0}
.fgrid2 .file .cd{--s:60px !important}
.fgrid2 .file .m{display:none !important}
.fgrid2 .file .t{font-size:11px !important;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:center}
.fgrid2 .file .cdw{border-radius:50%;box-shadow:0 0 0 3px var(--ring,rgba(255,255,255,.55))}
.fgrid2 .file.playing .cdw{--ring:#5FD8FF;box-shadow:0 0 0 3px #5FD8FF,0 0 12px rgba(95,216,255,.6)}
.fgrid2 .file.hold .cdw{--ring:#F5B82E}
.fgrid2 .file.beaten .cdw{--ring:#FFD34D}
.fgrid2 .file.dropped .cdw,.fgrid2 .file.skip .cdw{--ring:#8A9AB0}
@media (min-width:760px){ .fgrid.fgrid2{grid-template-columns:repeat(auto-fill,minmax(110px,1fr)) !important} }
/* B: detailed list */
.flist2 .lrows{border-radius:18px;background:var(--pane);border:1px solid var(--pane-line);overflow:hidden}
.lrow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;border-bottom:1px solid var(--pane-line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.lrows > .lrow:last-child{border-bottom:0}
.lrow .cd{flex:0 0 auto}
.lrow-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lrow-t b{font-size:14px;font-weight:800;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lrow-t small{font-size:11.5px;font-weight:600;color:var(--soft);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lrow-m{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:11.5px;font-weight:800}
.lrow-bar{width:64px;height:4px;border-radius:2px;background:var(--tint);overflow:hidden}.lrow-bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#7FE7FF,#2E9BE0)}
.lrow-st{padding:1px 7px;border-radius:999px;font-size:9.5px;font-weight:900;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.lrow:active{background:var(--tint)}

@media (prefers-color-scheme:light){ .lrow-st{color:color-mix(in srgb,var(--c) 62%,#000)} }
/* Library scrolls inside its own list, so the list (not the page) leaves room for the dock and runs to the bottom of the screen */
#stageBody.flush{padding-bottom:0 !important}
#stageBody.flush #libList{padding-bottom:calc(104px + env(safe-area-inset-bottom)) !important}
.ab-studio{margin:10px 0 0;padding:9px 12px;border-radius:14px;text-align:center;font-size:13px;letter-spacing:.02em;background:var(--tint);border:1px solid var(--edge)}
.ab-studio span{font-weight:600;color:var(--soft)}
.ab-studio b{font-weight:900;letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(90deg,#7F6BFF,#D25FB0,#5FA8E8);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-color-scheme:dark){ .ab-studio b{background:linear-gradient(90deg,#B49CFF,#FF9FD8,#7FE7FF);-webkit-background-clip:text;background-clip:text} }
/* ===== Aurora opening ===== */
.i2-aurora{background:radial-gradient(ellipse at 50% 40%,#16285E 0%,#0B1840 50%,#050B24 100%) !important}
.au-sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;animation:auIn calc(.6s * var(--k,1)) ease-out both}
.au-rib{position:absolute;left:-40%;width:180%;height:34vh;border-radius:50%;filter:blur(38px);opacity:.7;mix-blend-mode:screen;animation:auDrift calc(6s * var(--k,1)) ease-in-out infinite alternate}
.au-rib.r1{top:4vh;background:linear-gradient(90deg,transparent,#5FF2B0 25%,#5FD8FF 50%,#9B7BFF 75%,transparent);transform:rotate(-10deg)}
.au-rib.r2{top:30vh;height:26vh;background:linear-gradient(90deg,transparent,#9B7BFF 20%,#FF7FC8 55%,#FFB067 80%,transparent);transform:rotate(8deg);animation-delay:-2s;opacity:.55}
.au-rib.r3{top:58vh;background:linear-gradient(90deg,transparent,#5FD8FF 30%,#FF9FD8 70%,transparent);transform:rotate(-6deg);animation-delay:-4s;opacity:.45}
.au-rib.r4{top:78vh;height:22vh;background:linear-gradient(90deg,transparent,#5FF2B0 35%,#7FE7FF 65%,transparent);transform:rotate(5deg);animation-delay:-1s;opacity:.35}
@keyframes auDrift{from{translate:-8% 0;filter:blur(38px) hue-rotate(0deg)}to{translate:8% -2vh;filter:blur(44px) hue-rotate(25deg)}}
@keyframes auIn{from{opacity:0}to{opacity:1}}
.i2-aurora .in-disc{box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 40px rgba(180,156,255,.55),0 18px 40px rgba(0,0,0,.35)}
.i2-aurora .in-ring{border-color:rgba(255,255,255,.55)}
.i2-studio{position:relative;z-index:2;margin-top:-14px;font-size:11px;font-weight:900;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.85);text-shadow:0 0 12px rgba(180,156,255,.7);opacity:0;animation:auStudio calc(.6s * var(--k,1)) ease-out forwards;animation-delay:calc(1.05s * var(--k,1))}
@keyframes auStudio{from{opacity:0;transform:translateY(6px);letter-spacing:.5em}to{opacity:1;transform:none;letter-spacing:.32em}}
.intro.calm .au-rib{animation:none}.intro.calm .i2-studio{animation:none;opacity:1}
.th-aurora{background:radial-gradient(circle,#fff 0 6%,transparent 7%),conic-gradient(#5FD8FF,#9B7BFF,#FF7FC8,#FFE066,#5FF2B0,#5FD8FF) center/44% 70% no-repeat,linear-gradient(170deg,#5FF2B0 0%,#5FD8FF 18%,#16285E 40%,#9B7BFF 62%,#FF7FC8 75%,#0B1840 100%)}

/* Aurora disc: richer holo colors and a softer flash, so the disc shows its colors the whole way in */
.i2-aurora .in-disc{background:radial-gradient(circle closest-side,transparent 0 15%,rgba(255,255,255,.95) 16% 28%,rgba(160,190,215,.9) 29% 31%,transparent 32%),conic-gradient(from 200deg,#5FD8FF,#9B7BFF,#FF7FC8,#FFE066,#5FF2B0,#5FD8FF,#9B7BFF,#FF7FC8,#5FD8FF) !important;animation-name:auDisc !important}
@keyframes auDisc{0%{transform:scale(.25) rotate(0);opacity:0;filter:brightness(1.5)}25%{opacity:1}55%{transform:scale(1.05) rotate(540deg);filter:brightness(1.15) drop-shadow(0 0 30px rgba(127,231,255,.9))}100%{transform:scale(1) rotate(900deg);filter:drop-shadow(0 0 22px rgba(180,156,255,.7))}}
/* ===== A livelier timer ===== */
.np2-card.np2-on{border-color:transparent}
.np2-card.np2-on::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;z-index:3;
  background:conic-gradient(from var(--lva,0deg),#FF5E99,#FFB067,#FFE066,#5FF2B0,#5FD8FF,#9B7BFF,#FF5E99);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:lvSpin 4s linear infinite}
@property --lva{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes lvSpin{to{--lva:360deg}}
.np2-card.np2-on{box-shadow:0 12px 30px rgba(0,30,80,.22),0 0 26px rgba(255,94,153,.28)}
.np2-card.np2-paused::after{animation:none;opacity:.5}
.np2-k .lv-dot{display:inline-block;width:8px;height:8px;margin-right:4px;border-radius:50%;background:#FF4F7B;box-shadow:0 0 0 0 rgba(255,79,123,.7);animation:lvPulse 1.4s ease-out infinite;vertical-align:1px}
@keyframes lvPulse{0%{box-shadow:0 0 0 0 rgba(255,79,123,.7)}100%{box-shadow:0 0 0 9px rgba(255,79,123,0)}}
.np2-live{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 10px 10px 14px;border-radius:18px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.lv-t{flex:1;min-width:0;display:flex;flex-direction:column}
.lv-t small{font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.lv-clock{font-size:30px;font-weight:900;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.1;text-shadow:0 0 14px rgba(255,255,255,.35)}
.np2-paused .lv-clock{opacity:.7}
.np2-live .btn{flex:0 0 auto;padding:10px 14px;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.np2-live .lv-pz{background:rgba(255,255,255,.22) !important;border-color:rgba(255,255,255,.5) !important;color:#fff !important}
.np2-live .lv-stop{background:linear-gradient(180deg,#FF6B8E,#E23D66) !important;border-color:rgba(255,255,255,.55) !important;color:#fff !important;font-weight:900}
.np2-live .bi{width:15px;height:15px}
.np2-on .np2-actions{margin-top:10px}.np2-on .np2-actions .btn{flex:1}
/* the pill steps aside on Now Playing while the card shows the session */
:root[data-np-live] #timerPill{display:none !important}
/* the floating pill, in the app's glass style */
.tm-pill.tm-pill2{gap:9px;padding:6px 8px 6px 6px !important;border-radius:999px !important;color:var(--ink) !important;border:1.6px solid transparent !important;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.5)) padding-box,linear-gradient(100deg,#FF9FC0,#FFC4E8 25%,#C9B8FF 50%,#9FF0FF 75%,#B8FFE0) border-box !important;
  -webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 10px 26px rgba(0,30,80,.25),0 0 18px rgba(255,94,153,.25) !important;bottom:calc(var(--tb,88px) + 4px) !important}
@media (prefers-color-scheme:dark){ .tm-pill.tm-pill2{background:linear-gradient(180deg,rgba(44,76,130,.78),rgba(14,28,58,.72)) padding-box,linear-gradient(100deg,rgba(255,94,153,.8),rgba(201,184,255,.8) 50%,rgba(127,231,255,.8)) border-box !important;color:#EAF4FF !important} }
.tmp-disc{flex:0 0 auto;display:inline-flex}.tmp-disc .cd{animation:spin 3.5s linear infinite}
.tm-pill2.paused .tmp-disc .cd{animation-play-state:paused;opacity:.7}
.tm-pill2 .tm-dot{display:none}
.tm-pill2 #tmClock{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.tm-pill2 .tm-t{font-weight:800}
@media (prefers-reduced-motion:reduce){ .np2-card.np2-on::after,.np2-k .lv-dot,.tmp-disc .cd{animation:none} }
:root[data-lite] .np2-card.np2-on::after,:root[data-lite] .tmp-disc .cd{animation:none}
/* ===== Timer look A, compact ===== */
.rt2{position:relative;flex:0 0 auto;display:inline-flex;padding:9px}
.rt2-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#FF5E7E 0 var(--rp),rgba(255,255,255,.16) var(--rp));
  -webkit-mask:radial-gradient(circle,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(circle closest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));filter:drop-shadow(0 0 5px rgba(255,94,126,.7))}
.rt2 .np2-disc{filter:none}
.np2-paused .rt2-ring{filter:none;opacity:.55}
/* a soft red pulse around the card instead of the rainbow rim */
.np2-card.np2-on::after{display:none !important}
.np2-card.np2-on{border-color:rgba(255,120,140,.55) !important;animation:lvGlow 2.4s ease-in-out infinite}
@keyframes lvGlow{0%,100%{box-shadow:0 12px 30px rgba(0,30,80,.22),0 0 0 0 rgba(255,79,110,.0),0 0 18px rgba(255,79,110,.25)}50%{box-shadow:0 12px 30px rgba(0,30,80,.22),0 0 0 4px rgba(255,79,110,.22),0 0 34px rgba(255,79,110,.45)}}
.np2-card.np2-paused{animation:none;border-color:rgba(255,255,255,.4) !important}
@media (prefers-reduced-motion:reduce){ .np2-card.np2-on{animation:none;box-shadow:0 0 0 3px rgba(255,79,110,.3)} }
:root[data-lite] .np2-card.np2-on{animation:none}

/* No accidental zooming: double-taps don’t zoom, and text boxes are big enough that iPhone doesn’t zoom in when you tap them */
html,body,button,a,input,select,textarea,label,[data-game]{touch-action:manipulation}
@media (max-width:759px){ input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{font-size:16px !important} }
/* ===== Wrapped ===== */
.wr-entry{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 12px;padding:12px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.55);color:#fff;font:inherit;text-align:left;cursor:pointer;
  background:radial-gradient(circle at 15% 30%,rgba(95,242,176,.55),transparent 45%),radial-gradient(circle at 85% 70%,rgba(255,127,200,.55),transparent 50%),linear-gradient(135deg,#1E3A7A,#3A2A8A);box-shadow:0 10px 24px rgba(30,30,120,.3)}
.wr-entry b{display:block;font-size:17px;font-weight:900}.wr-entry small{font-size:12px;opacity:.88;font-weight:700}.wr-entry > span:nth-child(2){flex:1}
.wr-entry em{font-style:normal;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.22);font-size:12px}
.wr-e-disc,.wr-bigdisc{flex:0 0 auto;border-radius:50%;background:radial-gradient(circle closest-side,transparent 0 15%,#fff 16% 27%,transparent 28%),conic-gradient(from 200deg,#5FD8FF,#9B7BFF,#FF7FC8,#FFE066,#5FF2B0,#5FD8FF);box-shadow:0 0 0 2px #fff}
.wr-e-disc{width:44px;height:44px;animation:spin 8s linear infinite}
.wrap-ov{position:fixed;inset:0;z-index:100003;color:#fff;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#16285E 0%,#0B1840 50%,#050B24 100%);animation:pop .25s ease-out}
.wr-bars{position:absolute;left:12px;right:52px;top:calc(12px + env(safe-area-inset-top));display:flex;gap:4px;z-index:3}
.wr-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}.wr-bars i b{display:block;height:100%;width:0;background:#fff}
.wr-bars i{display:block;padding:0;margin:0;border:0;box-shadow:none}.wr-bars i.wr-done b{width:100%}.wr-bars i.wr-now b{animation:wrBar 5.2s linear forwards}
@keyframes wrBar{to{width:100%}}
.wr-x{position:absolute;right:10px;top:calc(4px + env(safe-area-inset-top));z-index:4;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:16px;cursor:pointer}
.wr-tap{position:absolute;top:70px;bottom:0;z-index:2;border:0;background:none;cursor:pointer}.wr-tap.prev{left:0;width:30%}.wr-tap.next{right:0;width:70%}.wr-tap[hidden]{display:none}
.wr-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:70px 26px 40px;z-index:1}
.wr-c{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;animation:wrIn .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes wrIn{from{opacity:0;transform:translateY(24px) scale(.96)}}
.wr-k{font-size:12px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;opacity:.8}
.wr-c h1{margin:10px 0 0;font-size:44px;line-height:1.05;font-weight:900;text-shadow:0 0 24px rgba(180,156,255,.6)}
.wr-c h2{margin:6px 0 0;font-size:32px;line-height:1.1;font-weight:900;overflow-wrap:anywhere}
.wr-c p{margin:0;font-size:16px;font-weight:600;opacity:.9;line-height:1.4}
.wr-pre{opacity:.85}
.wr-num{font-size:96px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#9FF0FF,#C9B8FF,#FFC4E8,#FFF0B0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(180,156,255,.5))}
.wr-unit{font-size:20px !important;font-weight:900 !important;margin-top:-4px !important}
.wr-hero{margin:16px 0 4px}.wr-bigdisc{display:block;width:170px;height:170px;box-shadow:0 0 0 4px #fff,0 0 50px rgba(180,156,255,.7);animation:spin 6s linear infinite}
.wr-disc{display:inline-flex;filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))}.wr-disc .cd{animation:spin 10s linear infinite}
.wr-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:6px 0}
.wr-icon{font-size:76px;line-height:1;margin:6px 0;filter:drop-shadow(0 0 20px rgba(255,255,255,.35))}
.wr-month{font-size:46px !important;background:linear-gradient(90deg,#5FF2B0,#5FD8FF,#9B7BFF,#FF7FC8);-webkit-background-clip:text;background-clip:text;color:transparent}
.wr-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin:8px 0 6px}
.wr-sum div{padding:12px 8px;border-radius:16px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}.wr-sum .wide{grid-column:1/-1}
.wr-sum b{display:block;font-size:22px;font-weight:900;overflow-wrap:anywhere}.wr-sum span{font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.wr-share,.wr-again{width:100%;padding:13px !important;font-size:15px !important;position:relative;z-index:5}
.wr-again{background:rgba(255,255,255,.16) !important;border-color:rgba(255,255,255,.4) !important;color:#fff !important}
.wr-end ~ .wr-tap,.wrap-ov:has(.wr-end) .wr-tap{display:none}
@media (prefers-reduced-motion:reduce){ .wr-bigdisc,.wr-disc .cd,.wr-e-disc{animation:none} }
</style>
</head>
<body>


<div id="os">
  <main class="stage" id="stage"><header class="stage-h"><span class="ti" id="stageIcon"></span><h1 id="stageTitle"></h1></header><div class="stage-body" id="stageBody"></div></main>
  <div class="dscrim" id="dscrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Game details"><div class="handle"></div><div id="drawerBody"></div></aside>
  <div class="start" id="start" hidden></div>
  <footer class="taskbar" id="taskbar">
    <div class="tasks" id="tasks"></div>
    <div class="tray" id="tray"></div>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head"><h3 id="sheetTitle">Add game</h3><button type="button" class="mode-btn" id="modeBtn">Add several</button></div>
  <div class="sheet-scroll" id="sheetScroll">
  <div id="singleTitle">
    <label for="fTitle">Game title</label>
    <input id="fTitle" placeholder="e.g. Kingdom Hearts II" autocomplete="off">
    <span class="dup" id="dupNote" hidden></span>
  </div>
  <div id="bulkTitle" hidden>
    <label for="fBulk">Game titles</label>
    <textarea id="fBulk" rows="6" placeholder="One title per line&#10;Kingdom Hearts&#10;Kingdom Hearts II&#10;Kingdom Hearts III"></textarea>
    <span class="hint">Everything below applies to every game in the list. They're added in this order, so list a series from first to last.</span>
    <span class="dup" id="bulkNote" hidden></span>
  </div>
  <div class="grid2">
    <div><label for="fSeries">Series</label>
      <input id="fSeries" list="seriesList" placeholder="Optional" autocomplete="off"><datalist id="seriesList"></datalist></div>
    <div><label for="fSub">Sub-series</label>
      <input id="fSub" list="subList" placeholder="e.g. XIII" autocomplete="off"><datalist id="subList"></datalist></div>
  </div>
  <label for="fPlatform">Consoles</label>
  <input id="fPlatform" placeholder="e.g. Switch, PS5 (separate with commas)" autocomplete="off">
  <div class="tag-sugs" id="consoleSugs"></div>
  <label>Status</label>
  <div class="seg" id="statusSeg">
    <button type="button" data-status="backlog" aria-pressed="true">Want to play</button>
    <button type="button" data-status="playing" aria-pressed="false">Playing</button>
    <button type="button" data-status="beaten" aria-pressed="false">Beaten</button>
    <button type="button" data-status="hold" aria-pressed="false">On hold</button>
    <button type="button" data-status="dropped" aria-pressed="false">Dropped</button>
    <button type="button" data-status="skip" aria-pressed="false">Not interested</button>
  </div>
  <div id="singleRest">
  <div id="dateRow" hidden>
    <label for="fDate" id="dateLabel">Date beaten</label>
    <input id="fDate" type="date">
    <label class="check-row" id="dateUnknownRow" style="margin-top:8px" hidden><input type="checkbox" id="fDateUnknown">Don't remember the date</label>
  </div>
  <label class="toggle" id="completeRow" hidden><input type="checkbox" id="fComplete">100% complete</label>
  <div class="grid2">
    <div><label for="fHours">Hours played</label>
      <input id="fHours" type="text" inputmode="text" placeholder="0:00:00" autocomplete="off" aria-describedby="fHoursHint"><small id="fHoursHint" class="hint">h:mm:ss, like 12:30:00</small></div>
    <div><label>Rating</label>
      <div class="stars-input" id="fRating" role="group" aria-label="Rating">
        <button type="button" data-star="1" aria-label="1 star" aria-pressed="false">★</button><button type="button" data-star="2" aria-label="2 stars" aria-pressed="false">★</button><button type="button" data-star="3" aria-label="3 stars" aria-pressed="false">★</button><button type="button" data-star="4" aria-label="4 stars" aria-pressed="false">★</button><button type="button" data-star="5" aria-label="5 stars" aria-pressed="false">★</button>
      </div></div>
  </div>
  <label>Owned</label>
  <div class="seg small" id="ownSeg">
    <button type="button" data-own="physical" aria-pressed="false">Physical</button>
    <button type="button" data-own="digital" aria-pressed="false">Digital</button>
    <button type="button" data-own="wishlist" aria-pressed="false">Wishlist</button>
    <button type="button" data-own="" aria-pressed="true">Not set</button>
  </div>
  <label for="fTags">Tags</label>
  <input id="fTags" placeholder="e.g. JRPG, horror, cozy" autocomplete="off">
  <div class="tag-sugs" id="tagSugs"></div>
  <div id="replayRow" hidden>
    <label>Replays</label>
    <ul class="rep-list" id="repList"></ul>
    <div class="rep-add"><input id="fRepDate" type="date" aria-label="Replay date"><button type="button" class="mini-btn go" id="repAdd">Add replay</button></div>
  </div>
  <label for="fNotes">Notes</label>
  <textarea id="fNotes" rows="3" placeholder="What did you think?"></textarea>
  <label>Cover photo</label>
  <div class="cover-row">
    <span class="cover-prev none" id="coverPrev"></span>
    <div>
      <label class="pick chrome" for="fCover">Choose photo</label>
      <input type="file" id="fCover" accept="image/*" class="vh">
      <span class="photo-status" id="photoStatus" aria-live="polite"></span>
      <button type="button" class="linkbtn" id="coverRemove" hidden>Remove photo</button>
    </div>
  </div>
  </div>
  <div class="actions">
    <button class="chrome" id="cancelBtn">Cancel</button>
    <button class="aqua" id="saveBtn">Save game</button>
  </div>
  <button class="del" id="delBtn" hidden>Delete game</button>
  </div>
</div>

<script>
/* Standalone storage: saves on this device (IndexedDB, with localStorage as a fallback).
   Same API the app used inside Claude, so nothing else had to change. */
(function(){
  const DB = 'game-shelf', STORE = 'kv'; let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction(STORE, mode), req = fn(t.objectStore(STORE));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
  const ls = { get:k => localStorage.getItem('gs:' + k), set:(k, v) => localStorage.setItem('gs:' + k, v), del:k => localStorage.removeItem('gs:' + k) };
  window.storage = {
    async get(key){ let v; try{ v = await tx('readonly', st => st.get(key)); }catch(e){ v = ls.get(key); }
      if (v == null) throw new Error('Key not found: ' + key); return { key, value: v, shared: false }; },
    async set(key, value){ try{ await tx('readwrite', st => st.put(value, key)); }catch(e){ ls.set(key, value); } return { key, value, shared: false }; },
    async delete(key){ try{ await tx('readwrite', st => st.delete(key)); }catch(e){ ls.del(key); } return { key, deleted: true, shared: false }; },
    async list(prefix = ''){ let keys; try{ keys = await tx('readonly', st => st.getAllKeys()); }catch(e){ keys = Object.keys(localStorage).filter(k => k.startsWith('gs:')).map(k => k.slice(3)); }
      return { keys: keys.map(String).filter(k => k.startsWith(prefix)), prefix, shared: false }; }
  };
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
<script>
const KEY = 'game-shelf-data', CKEY = 'game-shelf-covers', PKEY = 'game-shelf-prefs';
let games = [], covers = {}, prefs = { goals:{}, theme:'ice' };
let tab = 'home', statsView = 'stats', libMode = 'series', homePick = null, gsId = null, changerPick = null, changerFilter = 'next';
let groupMode = 'series', sortMode = 'size';
let gStatus = 'all', gConsole = 'all', gOwn = 'all', gTag = 'all', gSort = 'status', query = '';
let spinInOrder = true, spinConsole = 'all', spinSeries = 'all', spinTag = 'all', spinOwned = false, spinResult = null, spinAngle = 0, spinning = false;
let goalEditing = false, recapYear = new Date().getFullYear();
let editingId = null, editingGame = null, formStatus = 'backlog', formCover, formRating = 0, formOwn = '', formReplays = [], photoBusy = false, delArmed = null;
const openCards = new Set(), picked = {}, subPick = {}, rowLists = {};
let openSeries = null, gFiltersOpen = false;
let tlYear = null, tlFilter = 'all';
let bulkMode = false, dupArmed = false, undoSnap = null;
const norm = t => (t || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const findDup = (title, exceptId) => games.find(g => g.id !== exceptId && norm(g.title) && norm(g.title) === norm(title));

const ST = {
  backlog:{short:'To play', long:'Want to play', cls:'todo'},
  playing:{short:'Playing', long:'In progress', cls:'playing'},
  beaten:{short:'Beaten', long:'Beaten', cls:'beat'},
  hold:{short:'On hold', long:'On hold', cls:'hold'},
  dropped:{short:'Dropped', long:'Dropped', cls:'dropped'},
  skip:{short:'Skip', long:'Not interested', cls:'skip'}
};
const NEXT = {backlog:'playing', playing:'beaten', beaten:'backlog', hold:'playing', dropped:'backlog', skip:'backlog'};
const LIST_ORDER = {playing:0, hold:1, backlog:2, beaten:3, dropped:4, skip:5};
const OWN = { physical:'Physical', digital:'Digital', wishlist:'Wishlist' };
const NO_CONSOLE = 'No console set', STANDALONE = 'Standalone games';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue = s => { let h = 0; for (const ch of s) h = (h*31 + ch.charCodeAt(0)) % 360; return h; };
const starStr = n => n ? '★'.repeat(n) + '☆'.repeat(5-n) : '';
const fmtH = h => { const t = Math.max(0, Math.round((h || 0) * 3600)), hh = Math.floor(t / 3600), mm = Math.floor(t / 60) % 60, ss = t % 60; return `${hh}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; };
const parseHMS = v => { v = String(v || '').trim(); if (!v) return 0; if (v.includes(':')){ const p = v.split(':').map(x => parseFloat(x) || 0); while (p.length < 3) p.push(0); return p[0] + p[1] / 60 + p[2] / 3600; } const n = parseFloat(v); return isNaN(n) ? NaN : n; };
const seriesOf = g => g.series?.trim() || STANDALONE;
const subOf = g => (g.series?.trim() && g.sub?.trim()) || '';
const tagsOf = g => Array.isArray(g.tags) ? g.tags : [];
const clears = g => g.status==='beaten' ? 1 + (g.replays?.length || 0) : 0;
function counts(l){
  const c = { b:0, pl:0, hold:0, todo:0, drop:0, skip:0 };
  l.forEach(g => { if (g.status==='beaten') c.b++; else if (g.status==='playing') c.pl++; else if (g.status==='hold') c.hold++;
    else if (g.status==='dropped') c.drop++; else if (g.status==='skip') c.skip++; else c.todo++; });
  c.n = l.length - c.drop - c.skip; return c;
}
const nBeat = l => counts(l).b;
// A game's console field can hold several, separated by commas ("PS5, Switch 2")
const platformsOf = g => (g.platform || '').split(',').map(x=>x.trim()).filter(Boolean);
function canonConsole(p){
  const k = p.toLowerCase();
  for (const g of games) for (const x of platformsOf(g)) if (x.toLowerCase() === k) return x; // first spelling wins
  return p;
}
function consolesOf(g){
  const out = [...new Set(platformsOf(g).map(canonConsole))];
  return out.length ? out : [NO_CONSOLE];
}
const consoleOf = g => consolesOf(g)[0];
const onConsole = (g, c) => consolesOf(g).includes(c);
const consoles = () => [...new Set(games.flatMap(consolesOf))].filter(c=>c!==NO_CONSOLE).sort((a,b)=>a.localeCompare(b));
const parseConsoles = v => { const seen = new Set();
  return v.split(',').map(x=>x.trim()).filter(Boolean).map(canonConsole)
    .filter(x => { const k = x.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).join(', '); };
function allTags(){
  const m = new Map(); games.forEach(g => tagsOf(g).forEach(t => { const k = t.toLowerCase(); if (!m.has(k)) m.set(k, t); }));
  return [...m.values()].sort((a,b)=>a.localeCompare(b));
}
const hasTag = (g, t) => tagsOf(g).some(x => x.toLowerCase() === t.toLowerCase());
const discHTML = (g, size) => covers[g.id]
  ? `<span class="cd photo" style="--s:${size}px;background-image:url('${covers[g.id]}')"></span>`
  : `<span class="cd gen" style="--s:${size}px;--h:${hue(g.title)}"></span>`;
const statusCls = g => ST[g.status].cls + (g.complete ? ' complete' : '');
const badgeOf = g => g.complete ? '★' : ({beat:'✓', playing:'▶', hold:'❚❚', dropped:'✕', skip:'–'})[ST[g.status].cls] || '';
function toast(msg, undo){
  const t = $('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button id="undoBtn">Undo</button>' : ''}`;
  t.classList.toggle('has-action', !!undo); t.classList.add('show');
  if (!undo) undoSnap = null;
  clearTimeout(toast.h); toast.h = setTimeout(()=>{ t.classList.remove('show','has-action'); undoSnap = null; }, undo ? 6000 : 3200);
}
// Take a snapshot before a change so it can be undone from the toast
function snapshot(){ undoSnap = { games: JSON.stringify(games), covers: { ...covers } }; }
function undo(){
  if (!undoSnap) return;
  const coversChanged = Object.keys(undoSnap.covers).length !== Object.keys(covers).length || Object.keys(undoSnap.covers).some(k => undoSnap.covers[k] !== covers[k]);
  games = JSON.parse(undoSnap.games); covers = undoSnap.covers; undoSnap = null;
  save(); if (coversChanged) saveCovers();
  render(); toast('Undone');
}
const toInput = ts => { const d = ts ? new Date(ts) : new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fromInput = v => { const [y,m,d] = v.split('-').map(Number); return new Date(y, m-1, d, 12).getTime(); };
const fmtDate = ts => new Date(ts).toLocaleDateString();

/* Storage */
async function load(){
  try{ const r = await window.storage.get(KEY, false); if (r && r.value) games = JSON.parse(r.value); }catch(e){}
  try{ const c = await window.storage.get(CKEY, false); if (c && c.value) covers = JSON.parse(c.value); }catch(e){}
  try{ const pr = await window.storage.get(PKEY, false); if (pr && pr.value) prefs = { goals:{}, theme:'ice', ...JSON.parse(pr.value) }; }catch(e){}
  [...games].sort((a,b)=>(a.order??0)-(b.order??0)).forEach((g,i)=>{ g.order = i; });
  applyTheme(); render();
}
async function save(){ try{ await window.storage.set(KEY, JSON.stringify(games), false); }catch(e){ console.error('Save failed', e); } }
async function savePrefs(){ try{ await window.storage.set(PKEY, JSON.stringify(prefs), false); }catch(e){} }
async function saveCovers(){
  try{ const r = await window.storage.set(CKEY, JSON.stringify(covers), false); if (!r) throw new Error('no result'); return true; }
  catch(e){ console.error('Cover save failed', e); toast('Your photo could not be saved. Try a smaller photo or remove a few old covers.'); return false; }
}
function applyStatus(g, st){
  if (st==='beaten' && g.status!=='beaten') g.finishedAt = Date.now();
  if (st!=='beaten'){ g.finishedAt = null; g.complete = false; }
  if ((st==='playing' || st==='hold') && !(g.status==='playing' || g.status==='hold')) g.startedAt = Date.now();
  g.status = st;
}
function addHours(g, h){
  if (!h) return;
  g.hours = Math.max(0, Math.round(((g.hours || 0) + h) * 3600) / 3600);
  (g.log ||= []).push({ t: Date.now(), h });
}
const hoursIn = (g, y) => (g.log || []).filter(e => new Date(e.t).getFullYear() === y).reduce((a,e)=>a+e.h, 0);
function applyTheme(){
  document.documentElement.dataset.theme = prefs.theme || 'ice';
  document.querySelectorAll('[data-theme-pick]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themePick === (prefs.theme || 'ice')));
}

/* Grouping */
function groupBy(keyFn, mode = 'size', list = games){
  const map = {};
  list.forEach(g => { [].concat(keyFn(g)).forEach(k => (map[k] ||= []).push(g)); });
  const pct = l => { const c = counts(l); return c.n ? c.b / c.n : 0; };
  return Object.entries(map).sort((a,b) => {
    const la = a[0]===STANDALONE || a[0]===NO_CONSOLE, lb = b[0]===STANDALONE || b[0]===NO_CONSOLE;
    if (la !== lb) return la ? 1 : -1;
    if (mode==='az') return a[0].localeCompare(b[0]);
    if (mode==='progress') return pct(b[1]) - pct(a[1]) || b[1].length - a[1].length;
    return b[1].length - a[1].length || a[0].localeCompare(b[0]);
  });
}
function groupSubs(list, subFn){
  const subs = {}, loose = [];
  list.forEach(g => { const s = subFn(g); s ? (subs[s] ||= []).push(g) : loose.push(g); });
  const byOrder = arr => [...arr].sort((x,y)=> (x.order??0)-(y.order??0));
  return { subs: Object.entries(subs).sort((a,b)=>a[0].localeCompare(b[0], undefined, {numeric:true})).map(([n,l])=>[n, byOrder(l)]), loose: byOrder(loose) };
}

/* Render */
function oldRender(){
  document.querySelectorAll('.dock [data-tab]').forEach(t => t.setAttribute('aria-selected', t.dataset.tab===tab));
  $('view').dataset.tab = tab;
  $('view').innerHTML = tab==='home' ? viewHome() : tab==='library' ? viewLibrary() : tab==='stats' ? viewStats() : viewSpin();
  if (gsId && $('gsheet').classList.contains('open')) openGame(gsId, true);
  if (tab==='stats' && statsView==='timeline') initTimeline();
}
const empty = (title, msg = 'Tap + to add a game.') => `<div class="empty glass"><b>${title}</b>${msg}</div>`;
const tagChips = g => tagsOf(g).map(t => `<span class="tagc">${esc(t)}</span>`).join('');
const progStyle = c => c.n ? `--b:${c.b/c.n*100}%;--q:${(c.b+c.pl)/c.n*100}%;--r:${(c.b+c.pl+c.hold)/c.n*100}%` : '--b:0%;--q:0%;--r:0%';

function discRow(list, key){
  const selId = list.some(g=>g.id===picked[key]) ? picked[key] : list[0].id;
  rowLists[key] = list.map(g=>g.id);
  const idx = list.findIndex(g=>g.id===selId);
  const discs = list.map(g => {
    const b = badgeOf(g), n = clears(g);
    return `<button class="disc-btn ${statusCls(g)} ${g.id===selId?'sel':''}" data-pick="${g.id}" data-group="${esc(key)}" aria-label="${esc(g.title)}, ${ST[g.status].long}">
      <span class="ring">${discHTML(g, 52)}${b?`<span class="badge">${b}</span>`:''}${n > 1 ? `<span class="rep">×${n}</span>` : ''}</span></button>`;
  }).join('');
  const g = list.find(x=>x.id===selId);
  const meta = [g.complete ? '100% complete' : ST[g.status].long, clears(g) > 1 ? `beaten ${clears(g)} times` : '', g.platform, g.hours ? fmtH(g.hours) : ''].filter(Boolean).join(', ');
  const quick = { backlog:['Start playing','playing'], playing:['Mark beaten','beaten'], hold:['Resume','playing'] }[g.status];
  return `<div class="row">${discs}</div>
    <div class="caption"><span class="ct"><span class="t">${esc(g.title)}</span>
      <span class="m">${g.rating ? `<span class="stars">${starStr(g.rating)}</span> ` : ''}${esc(meta)}${g.own ? `<span class="own-tag">${OWN[g.own]}</span>` : ''}</span>
      ${tagChips(g)}</span>
    <span class="cap-btns">
      ${list.length > 1 ? `<button class="mv" data-move="${g.id}" data-dir="-1" data-group="${esc(key)}" aria-label="Move left" ${idx===0?'disabled':''}>‹</button><button class="mv" data-move="${g.id}" data-dir="1" data-group="${esc(key)}" aria-label="Move right" ${idx===list.length-1?'disabled':''}>›</button>` : ''}
      ${g.status==='playing' ? `<button class="mini-btn hr" data-hour="${g.id}" aria-label="Add one hour">+1h</button>` : ''}
      ${quick ? `<button class="mini-btn go" data-quick="${g.id}" data-to="${quick[1]}">${quick[0]}</button>` : ''}
      <button class="mini-btn" data-id="${g.id}">Edit</button></span></div>`;
}

function featured(list){
  const by = st => list.filter(g=>g.status===st);
  return by('playing')[0] || by('hold')[0] || by('beaten').sort((a,b)=>(b.finishedAt||0)-(a.finishedAt||0))[0] || [...list].sort((a,b)=>(a.order??0)-(b.order??0))[0];
}
function fanArt(list, size){
  const c = counts(list), f = featured(list);
  const rest = [...list].filter(g=>g!==f && g.status!=='skip').sort((a,b)=>(a.order??0)-(b.order??0)).slice(0,2);
  const back = rest.map((g,i)=>`<span class="fan f${i+2}">${discHTML(g, Math.round(size*.9))}</span>`).join('');
  return `<span class="tile-art" aria-hidden="true">${back}<span class="fan f1 ${f.status==='playing'?'playing':''}" style="${progStyle(c)}">${discHTML(f, size)}</span></span>`;
}
const tbar = c => c.n ? `<span class="tbar" aria-hidden="true"><i class="b" style="width:${c.b/c.n*100}%"></i><i class="pl" style="width:${c.pl/c.n*100}%"></i><i class="h" style="width:${c.hold/c.n*100}%"></i></span>` : '';
function viewShelf(){
  if (!games.length) return empty('Your shelf is empty');
  const byConsole = groupMode === 'console';
  const subFn = byConsole ? (g => g.series?.trim() || '') : subOf;
  const groups = groupBy(byConsole ? consolesOf : seriesOf, sortMode);
  const open = openSeries && groups.find(([n]) => groupMode + ':' + n === openSeries);
  if (openSeries && !open) openSeries = null;

  if (open){
    const [name, list] = open, c = counts(list), key = openSeries;
    const { subs, loose } = groupSubs(list, subFn);
    const ordered = [...subs.flatMap(([,sl])=>sl), ...loose];
    let body;
    if (!subs.length) body = discRow(loose, key+'|');
    else {
      const tabsList = [['*', 'All', ordered], ...subs.map(([n,l])=>[n,n,l]), ...(loose.length ? [['~', byConsole ? 'Standalone' : 'Other', loose]] : [])];
      const cur = tabsList.some(([id]) => id === subPick[key]) ? subPick[key] : '*';
      const tabs = tabsList.map(([id, label, l]) => { const sc = counts(l), done = id !== '*' && sc.n && sc.b === sc.n;
        return `<button class="sub-tab ${done?'done':''}" data-sub="${esc(id)}" data-subkey="${esc(key)}" aria-pressed="${cur===id}">${esc(label)}<small>${sc.b}/${sc.n}</small></button>`; }).join('');
      body = `<div class="sub-tabs" role="group" aria-label="${byConsole?'Series':'Sub-series'}">${tabs}</div>` + discRow(tabsList.find(([id]) => id === cur)[2], key+'|'+cur);
    }
    const stat = (n, cls, label) => n ? `<span class="sd-stat"><span class="dot ${cls}"></span>${n} ${label}</span>` : '';
    return `<button class="sd-back" data-back>‹ All ${byConsole ? 'consoles' : 'series'}</button>
      <div class="sd-head glass">${fanArt(list, 110)}
        <div class="sd-info"><h2>${esc(name)}</h2>
          <span class="tile-meta"><span><b>${c.b}</b> of ${c.n} beaten</span>${c.n && c.b===c.n ? '<span class="done-badge">Complete</span>' : ''}</span>
          <div class="sd-stats">${stat(c.pl,'playing','playing')}${stat(c.hold,'hold','on hold')}${stat(c.todo,'todo','to play')}${stat(c.drop,'dropped','dropped')}${stat(c.skip,'skip','not interested')}</div>
          ${tbar(c)}</div></div>
      <div class="sd-body glass">${body}</div>`;
  }

  const toolbar = `<div class="toolbar">
    <select id="sortSel" aria-label="Sort" style="margin-left:0">${[['size','Most games'],['progress','Most complete'],['az','A to Z']]
      .map(([k,l])=>`<option value="${k}" ${sortMode===k?'selected':''}>${l}</option>`).join('')}</select></div>`;
  const qq = query.trim().toLowerCase();
  const shownGroups = qq ? groups.filter(([n,l]) => n.toLowerCase().includes(qq) || l.some(g=>g.title.toLowerCase().includes(qq))) : groups;
  if (!shownGroups.length) return toolbar + empty('No matches', 'Try a different search.');
  const tiles = shownGroups.map(([name, list]) => {
    const c = counts(list), key = groupMode + ':' + name;
    return `<button class="tile glass ${c.pl ? 'now' : ''}" data-open="${esc(key)}" aria-label="${esc(name)}, ${c.b} of ${c.n} beaten">
      ${fanArt(list, 84)}${c.n && c.b===c.n ? '<span class="done-badge">Complete</span>' : ''}
      <span class="tile-name">${esc(name)}</span>
      <span class="tile-meta"><span><b>${c.b}</b>/${c.n} beaten</span><span>${list.length} game${list.length===1?'':'s'}</span></span>
      ${tbar(c)}</button>`;
  }).join('');
  return toolbar + `<div class="tiles">${tiles}</div>`;
}

function viewGames(){
  if (!games.length) return empty('No games yet');
  const cs = consoles(), tags = allTags(), c = counts(games);
  if (gConsole!=='all' && !cs.includes(gConsole)) gConsole = 'all';
  if (gTag!=='all' && !tags.some(t=>t.toLowerCase()===gTag.toLowerCase())) gTag = 'all';
  const st = [['all','All',games.length],['playing','Playing',c.pl],['backlog','To play',c.todo],['beaten','Beaten',c.b],['hold','On hold',c.hold],['dropped','Dropped',c.drop],['skip','Not interested',c.skip]]
    .filter(([k,,n]) => n || k==='all' || k===gStatus || ['playing','backlog','beaten'].includes(k));
  const row = (items, attr, cur) => `<div class="chips-row">${items.map(([k,l,n])=>`<button class="chip-btn" ${attr}="${esc(k)}" aria-pressed="${cur===k}">${esc(l)}${n!==undefined?`<small>${n}</small>`:''}</button>`).join('')}</div>`;
  const sortSel = `<select id="gSortSel" aria-label="Sort">${[['status','By status'],['rating','Top rated'],['hours','Most played'],['title','A to Z']]
      .map(([k,l])=>`<option value="${k}" ${gSort===k?'selected':''}>${l}</option>`).join('')}</select>`;
  const active = (gConsole!=='all') + (gTag!=='all') + (gOwn!=='all');
  const hasOwn = games.some(g=>g.own);
  const panel = gFiltersOpen ? `<div class="filters glass">
      ${cs.length ? `<p class="set-h">Console</p>${row([['all','Any'], ...cs.map(x=>[x,x])], 'data-console', gConsole)}` : ''}
      ${tags.length ? `<p class="set-h">Tag</p>${row([['all','Any'], ...tags.map(x=>[x,x])], 'data-gtag', gTag)}` : ''}
      ${hasOwn ? `<p class="set-h">Owned</p>${row([['all','Any'],['physical','Physical'],['digital','Digital'],['wishlist','Wishlist']], 'data-gown', gOwn)}` : ''}
      ${!cs.length && !tags.length && !hasOwn ? '<p class="pool">Add consoles, tags, or ownership to your games to filter by them.</p>' : ''}
      ${active ? '<button class="clear-f" id="clearFilters">Clear filters</button>' : ''}</div>` : '';
  return `<input class="search" id="q" type="search" placeholder="Search titles, series, consoles, tags, or notes" value="${esc(query)}" autocomplete="off">
    ${row(st, 'data-gstatus', gStatus)}
    <div class="g-tools"><button class="filter-btn" id="filterBtn" aria-expanded="${gFiltersOpen}">Filters${active ? `<b>${active}</b>` : ''}</button>${sortSel}</div>
    ${panel}<div id="gameList">${gameList()}</div>`;
}
function gameList(){
  const q = query.trim().toLowerCase();
  const list = games.filter(g => (gStatus==='all' || g.status===gStatus) && (gConsole==='all' || onConsole(g, gConsole)) &&
      (gOwn==='all' || g.own===gOwn) && (gTag==='all' || hasTag(g, gTag)) &&
      (!q || [g.title, g.series, g.sub, g.platform, g.notes, ...tagsOf(g)].some(v => v && v.toLowerCase().includes(q))))
    .sort((a,b) => gSort==='title' ? a.title.localeCompare(b.title)
      : gSort==='rating' ? ((b.rating||0)-(a.rating||0) || a.title.localeCompare(b.title))
      : gSort==='hours' ? ((b.hours||0)-(a.hours||0) || a.title.localeCompare(b.title))
      : (LIST_ORDER[a.status]-LIST_ORDER[b.status]) ||
        (a.status==='beaten' ? (b.finishedAt||0)-(a.finishedAt||0) : (a.status==='playing'||a.status==='hold') ? (b.startedAt||0)-(a.startedAt||0) : 0) ||
        a.title.localeCompare(b.title));
  if (!list.length) return empty(q ? 'No matches' : 'Nothing here yet', q ? 'Try a different search.' : 'Tap + to add a game.');
  return `<p class="count-line">${list.length} game${list.length===1?'':'s'}</p>` + list.map(g => {
    const when = g.status==='beaten' && g.finishedAt ? 'Beaten ' + fmtDate(g.finishedAt)
      : (g.status==='playing' || g.status==='hold') && g.startedAt ? 'Started ' + fmtDate(g.startedAt) : '';
    const meta = [subOf(g) ? `${seriesOf(g)} (${subOf(g)})` : seriesOf(g), g.platform, when, g.hours ? fmtH(g.hours) : '',
      g.complete ? '100%' : '', clears(g) > 1 ? `×${clears(g)}` : ''].filter(Boolean).join(', ');
