/* Spin */
function chainOf(g){
  const ser = g.series?.trim(); if (!ser) return null;
  if (subOf(g)) return games.filter(x => seriesOf(x)===ser && subOf(x)===subOf(g));
  return games.some(x => seriesOf(x)===ser && subOf(x)) ? null : games.filter(x => seriesOf(x)===ser);
}
function isNextUp(g){
  const chain = chainOf(g); if (!chain) return true;
  return [...chain].sort((a,b)=>(a.order??0)-(b.order??0)).find(x => !['beaten','dropped','skip'].includes(x.status)) === g;
}
const spinCandidates = () => games.filter(g => g.status==='backlog' && (spinConsole==='all' || onConsole(g, spinConsole)) &&
  (spinSeries==='all' || seriesOf(g)===spinSeries) && (spinTag==='all' || hasTag(g, spinTag)) && (!spinOwned || g.own==='physical' || g.own==='digital'));
function spinPool(){ const c = spinCandidates(); return spinInOrder ? c.filter(isNextUp) : c; }
function viewSpin(){
  const backlog = games.filter(g=>g.status==='backlog');
  if (!backlog.length) return empty('Nothing to spin yet', 'Add games as Want to play and they will show up here.');
  const cs = [...new Set(backlog.flatMap(consolesOf))].sort(), ss = [...new Set(backlog.map(seriesOf))].sort();
  const ts = [...new Set(backlog.flatMap(tagsOf))].sort();
  const sel = (id, cur, all, opts) => `<select id="${id}">${[['all', all], ...opts.map(o=>[o,o])].map(([v,l])=>`<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  const pool = spinPool(), held = spinInOrder ? spinCandidates().length - pool.length : 0;
  if (spinResult && !games.includes(spinResult)) spinResult = null;
  const disc = spinResult ? discHTML(spinResult, 190) : `<span class="cd gen" style="--s:190px;--h:195"></span>`;
  const r = spinResult;
  const result = r && !spinning ? `<div class="result"><span class="t">${esc(r.title)}</span>
      <span class="m">${esc([seriesOf(r) !== STANDALONE ? seriesOf(r) : '', r.platform].filter(Boolean).join(', ') || 'Up next')}</span>
      <div class="btns">${r.status==='backlog' ? `<button class="mini-btn go" data-quick="${r.id}" data-to="playing">Start playing</button>` : ''}<button class="mini-btn" data-game="${r.id}">View game</button></div></div>` : '';
  return `<div class="spin-wrap glass">
    <div class="spin-filters">${sel('spinConsole', spinConsole, 'Any console', cs)}${sel('spinSeries', spinSeries, 'Any series', ss)}${ts.length ? sel('spinTag', spinTag, 'Any tag', ts) : ''}</div>
    <label class="check-row"><input type="checkbox" id="spinOwned" ${spinOwned?'checked':''}>Only games I own</label>
    <label class="check-row"><input type="checkbox" id="spinInOrder" ${spinInOrder?'checked':''}>Play series in order</label>
    <div class="spin-stage"><div class="spin-disc" id="spinDisc" style="transform:rotate(${spinAngle}deg)">${disc}</div></div>
    <p class="pool">${pool.length} game${pool.length===1?'':'s'} in the spin${held ? `, ${held} sequel${held===1?'':'s'} waiting on earlier games` : ''}</p>
    <button class="btn primary aqua spin-btn" id="spinBtn" ${pool.length && !spinning ? '' : 'disabled'}>${spinResult ? 'Spin again' : 'Spin'}</button>
    ${result}</div>`;
}
function doSpin(){
  const pool = spinPool(); if (!pool.length || spinning) return;
  const opts = pool.length > 1 ? pool.filter(g=>g!==spinResult) : pool, pick = opts[Math.floor(Math.random()*opts.length)];
  spinning = true; spinAngle += 1440 + Math.floor(Math.random()*360);
  const el = $('spinDisc'), btn = $('spinBtn');
  if (btn) btn.disabled = true;
  document.querySelector('.result')?.remove();
  if (el) el.style.transform = `rotate(${spinAngle}deg)`;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => { spinning = false; spinResult = pick; render(); }, reduce ? 0 : 3300);
}

function viewTimeline(){
  // Every clear, oldest first, so we can number them and place milestones
  const all = [];
  games.forEach(g => {
    if (g.status==='beaten' && g.finishedAt) all.push({ t:g.finishedAt, g, kind: g.complete ? 'gold' : 'beat' });
    (g.replays||[]).forEach(t => all.push({ t, g, kind:'replay' }));
  });
  if (!all.length) return empty('No clears yet', 'Games you beat will show up here, month by month.');
  all.sort((a,b)=>a.t-b.t);
  const MILES = [1,5,10,25,50,75,100,150,200,250,300,400,500];
  let beatN = 0, firstGold = false;
  all.forEach(e => {
    e.key = e.g.id + ':' + e.t;
    if (e.kind !== 'replay'){ beatN++; if (MILES.includes(beatN)) e.mile = beatN === 1 ? 'First game beaten' : `${beatN} games beaten`; }
    if (e.kind === 'gold' && !firstGold){ firstGold = true; e.goldMile = 'First 100% completion'; }
  });
  const years = [...new Set(all.map(e=>new Date(e.t).getFullYear()))].sort((a,b)=>b-a);
  if (tlYear !== 'all' && !years.includes(tlYear)) tlYear = years[0];
  const inYear = tlYear === 'all' ? all : all.filter(e => new Date(e.t).getFullYear() === tlYear);
  const shown = inYear.filter(e => tlFilter==='all' || (tlFilter==='beat' && e.kind!=='replay') || e.kind===tlFilter);

  const chips = (items, attr, cur) => `<div class="chips-row">${items.map(([k,l])=>`<button class="chip-btn" ${attr}="${k}" aria-pressed="${cur===k}">${l}</button>`).join('')}</div>`;
  let hist;
  if (tlYear === 'all'){
    const ys = [...years].reverse().slice(-8), mx = Math.max(1, ...ys.map(y=>all.filter(e=>new Date(e.t).getFullYear()===y).length));
    hist = ys.map(y => { const n = all.filter(e=>new Date(e.t).getFullYear()===y).length;
      return `<button data-tly="${y}" aria-label="${y}: ${n} clears"><i style="height:${n/mx*70}%"></i>${String(y).slice(2)}</button>`; }).join('');
  } else {
    const per = Array(12).fill(0); inYear.forEach(e => per[new Date(e.t).getMonth()]++);
    const mx = Math.max(1, ...per), names = 'JFMAMJJASOND';
    hist = per.map((n,m) => `<button class="${n?'':'zero'}" data-tlm="${tlYear}-${m}" ${n?'':'disabled'} aria-label="${new Date(2000,m).toLocaleDateString(undefined,{month:'long'})}: ${n} clears"><i style="height:${n/mx*70}%"></i>${names[m]}</button>`).join('');
  }
  const nb = inYear.filter(e=>e.kind!=='replay').length, ng = inYear.filter(e=>e.kind==='gold').length, nr = inYear.filter(e=>e.kind==='replay').length;
  const top = `<div class="tl-top glass">
    ${chips([['all','All years'], ...years.map(y=>[String(y), String(y)])], 'data-tly', String(tlYear))}
    <p class="tl-sum"><b>${nb}</b> beaten${ng ? `, <b>${ng}</b> at 100%` : ''}${nr ? `, <b>${nr}</b> replay${nr===1?'':'s'}` : ''}${tlYear==='all' ? ' all time' : ` in ${tlYear}`}</p>
    <div class="hist">${hist}</div></div>
    ${chips([['all','Everything'],['beat','Beaten'],['gold','100%'],['replay','Replays']], 'data-tlf', tlFilter)}`;
  if (!shown.length) return top + empty('Nothing here', 'Try another year or filter.');

  // Newest first, grouped by month, cards alternating sides of the line
  const desc = [...shown].reverse();
  let html = '', curM = '', side = 0;
  desc.forEach(e => {
    const d = new Date(e.t), mk = `${d.getFullYear()}-${d.getMonth()}`;
    if (mk !== curM){
      curM = mk; const cnt = desc.filter(x => { const xd = new Date(x.t); return `${xd.getFullYear()}-${xd.getMonth()}` === mk; }).length;
      html += `<span class="tl-mpill" id="tlm-${mk}">${esc(d.toLocaleDateString(undefined,{month:'long', year:'numeric'}))}<small>${cnt}</small></span>`;
    }
    if (e.mile && tlFilter !== 'replay') html += `<span class="tl-mile">★ ${esc(e.mile)}</span>`;
    if (e.goldMile && tlFilter !== 'replay') html += `<span class="tl-mile gold">★ ${esc(e.goldMile)}</span>`;
    const g = e.g, label = e.kind==='gold' ? '100%' : e.kind==='replay' ? 'Replay' : 'Beaten';
    const more = [g.rating ? `<span class="stars">${starStr(g.rating)}</span>` : '', esc([g.platform, g.hours ? fmtH(g.hours) : '', seriesOf(g)!==STANDALONE ? seriesOf(g) : ''].filter(Boolean).join(', '))].filter(Boolean).join(' ');
    html += `<div class="tl-node ${side++ % 2 ? 'right' : 'left'} ${e.kind}">
      <span class="tl-disc">${discHTML(g, 46)}</span>
      <div class="tl-card glass" data-tlk="${esc(e.key)}" role="button" tabindex="0" aria-expanded="false">
        <span class="tl-kind">${label}</span><span class="t">${esc(g.title)}</span><span class="m">${esc(fmtDate(e.t))}</span>
        <div class="tl-more">${more}${tagChips(g)}${g.notes ? `<p>${esc(g.notes)}</p>` : ''}<button class="mini-btn" data-game="${g.id}">Open</button></div>
      </div></div>`;
  });
  return top + `<div class="tl2" id="tl2">${html}</div>`;
}
function initTimeline(){
  const box = $('tl2'); if (!box || typeof IntersectionObserver === 'undefined') return;

  box.classList.add('anim');
  const io = new IntersectionObserver(entries => entries.forEach(en => { if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }), { rootMargin:'0px 0px -8% 0px' });
  box.querySelectorAll('.tl-node').forEach(n => io.observe(n));

/* Sheet */
function readCover(file){
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onerror = () => rej(new Error('read'));
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        try{
          const H = 260, s = H / img.naturalHeight, w = img.naturalWidth * s, cw = Math.min(w, 260);
          const c = document.createElement('canvas'); c.width = Math.round(cw); c.height = H;
          c.getContext('2d').drawImage(img, (cw - w) / 2, 0, w, H);
          res(c.toDataURL('image/jpeg', 0.7));
        }catch(err){ rej(err); }
      };
      img.onerror = () => rej(new Error('decode'));
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

    : `<div class="np-main"><span class="np-art"><span class="cd gen" style="--s:150px;--h:195;opacity:.55"></span></span>

}

/* ---------- App: Library (explorer) ---------- */
function libItems(){
  const [kind, ...rest] = lib.nav.split(':'), val = rest.join(':');
  let list = games, title = 'All games', series = null;
  if (kind === 'st'){ list = games.filter(g=>g.status===val); title = ST[val].long; }
  if (kind === 'series'){ list = games.filter(g=>seriesOf(g)===val); title = val; series = true; }
  if (kind === 'sub'){ const [sr, sb] = val.split('|'); list = games.filter(g=>seriesOf(g)===sr && subOf(g)===sb); title = `${sr}: ${sb}`; series = true; }
  if (kind === 'con'){ list = games.filter(g=>onConsole(g, val)); title = val; }
  if (kind === 'tag'){ list = games.filter(g=>hasTag(g, val)); title = val; }
  const q = lib.q.trim().toLowerCase();
  if (q) list = list.filter(g => [g.title, g.series, g.sub, g.platform, g.notes, ...tagsOf(g)].some(v => v && v.toLowerCase().includes(q)));
  const sort = lib.sort === 'auto' ? (series ? 'order' : 'status') : lib.sort;
  list = [...list].sort((a,b) => sort==='order' ? (a.order??0)-(b.order??0)
    : sort==='title' ? a.title.localeCompare(b.title)
    : sort==='rating' ? (b.rating||0)-(a.rating||0) || a.title.localeCompare(b.title)
    : sort==='hours' ? (b.hours||0)-(a.hours||0) || a.title.localeCompare(b.title)
    : sort==='recent' ? (b.finishedAt||b.startedAt||0)-(a.finishedAt||a.startedAt||0)
    : (LIST_ORDER[a.status]-LIST_ORDER[b.status]) || a.title.localeCompare(b.title));
  return { list, title, kind };
}
function libListHTML(){
  const { list, title, kind } = libItems(), c = counts(list);
  const crumb = `<div class="crumb"><h3>${esc(title)}</h3><span class="m">${list.length} game${list.length===1?'':'s'}${c.n ? `, ${c.b} of ${c.n} beaten` : ''}</span>${['series','sub','con','tag'].includes(kind) ? tbar(c) : ''}</div>`;
  if (!list.length) return crumb + `<div id="libList"><p class="set-note" style="padding:20px 4px">${lib.q ? 'No games match your search.' : 'Nothing here yet.'}</p></div>`;
  const body = lib.view === 'grid'
    ? `<div class="fgrid">${list.map(g => `<button class="file ${statusCls(g)}" data-game="${g.id}"><span class="cdw">${discHTML(g, 64)}</span><span class="t">${esc(g.title)}</span>
        <span class="m"><span class="dot ${ST[g.status].cls}"></span>${g.complete ? '100%' : ST[g.status].short}</span></button>`).join('')}</div>`
    : `<table class="ftable"><thead><tr><th>Title</th><th>Series</th><th>Console</th><th>Status</th><th>Hours</th><th>Rating</th></tr></thead><tbody>
        ${list.map(g => `<tr data-game="${g.id}"><td><span class="tcell">${discHTML(g, 26)}${esc(g.title)}</span></td><td>${esc(subOf(g) ? `${seriesOf(g)} (${subOf(g)})` : (g.series ? seriesOf(g) : ''))}</td>
          <td>${esc(g.platform || '')}</td><td><span class="dot ${ST[g.status].cls}" style="display:inline-block;margin-right:5px"></span>${g.complete ? '100%' : ST[g.status].short}</td>
          <td>${g.hours ? fmtH(g.hours) : ''}</td><td>${g.rating ? `<span class="stars">${starStr(g.rating)}</span>` : ''}</td></tr>`).join('')}</tbody></table>`;
  return crumb + `<div id="libList">${body}</div>`;
}
function appLibrary(){
  if (!games.length) return `<p class="set-note" style="padding:20px">Your library is empty. Use Add Game on the desktop to start.</p>`;
  const c = counts(games);
  const nav = (id, label, n, extra = '') => `<button class="nav ${extra}" data-libnav="${esc(id)}" aria-current="${lib.nav===id}">${label}<span class="n">${n}</span></button>`;
  const statusNav = [['playing',c.pl],['backlog',c.todo],['beaten',c.b],['hold',c.hold],['dropped',c.drop],['skip',c.skip]]
    .filter(([k,n]) => n || ['playing','backlog','beaten'].includes(k))
    .map(([k,n]) => nav('st:'+k, `<span class="dot ${ST[k].cls}"></span>${ST[k].long}`, n)).join('');
  const series = groupBy(seriesOf, 'az').filter(([n])=>n!==STANDALONE).map(([n,l]) => nav('series:'+n, esc(n), l.length) +
    groupSubs(l, subOf).subs.map(([sn, sl]) => nav(`sub:${n}|${sn}`, esc(sn), sl.length, 'sub')).join('')).join('');
  const cons = consoles().map(k => nav('con:'+k, esc(k), games.filter(g=>onConsole(g,k)).length)).join('');
  const tags = allTags().map(t => nav('tag:'+t, esc(t), games.filter(g=>hasTag(g,t)).length)).join('');
  const opts = [['all','All games'], ...Object.keys(ST).map(k=>['st:'+k, ST[k].long]),
    ...groupBy(seriesOf, 'az').filter(([n])=>n!==STANDALONE).flatMap(([n,l]) => [['series:'+n, 'Series: '+n], ...groupSubs(l, subOf).subs.map(([sn])=>[`sub:${n}|${sn}`, `  ${n}: ${sn}`])]),
    ...consoles().map(k=>['con:'+k, 'Console: '+k]), ...allTags().map(t=>['tag:'+t, 'Tag: '+t])];
  return `<div class="lib">
    <nav class="side" aria-label="Library folders">
      <h4>Library</h4>${nav('all', 'All games', games.length)}${statusNav}
      ${series ? `<h4>Series</h4>${series}` : ''}${cons ? `<h4>Consoles</h4>${cons}` : ''}${tags ? `<h4>Tags</h4>${tags}` : ''}
    </nav>
    <div class="libmain">
      <div class="libnav-m"><select id="libNavSel" aria-label="Folder">${opts.map(([v,l])=>`<option value="${esc(v)}" ${lib.nav===v?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
      <div class="ltool"><input class="search" id="libQ" type="search" placeholder="Search this folder" value="${esc(lib.q)}" autocomplete="off">
        <select id="libSort" aria-label="Sort">${[['auto','Default order'],['order','Play order'],['title','A to Z'],['rating','Top rated'],['hours','Most played'],['recent','Recent']]
          .map(([k,l])=>`<option value="${k}" ${lib.sort===k?'selected':''}>${l}</option>`).join('')}</select>
        <span class="vt" role="group" aria-label="View"><button data-lview="grid" aria-pressed="${lib.view==='grid'}" aria-label="Icons">${ICONS.grid}</button><button data-lview="list" aria-pressed="${lib.view==='list'}" aria-label="Details">${ICONS.list}</button></span>
        <button class="btn primary" data-launch="add">+ Add</button></div>
      <div id="libArea" style="display:flex;flex-direction:column;min-height:0;flex:1">${libListHTML()}</div>
    </div></div>`;
}

/* ---------- App: Game properties ---------- */
function chainFor(g){ return games.filter(x => seriesOf(x)===seriesOf(g) && (subOf(g) ? subOf(x)===subOf(g) : !subOf(x))).sort((a,b)=>(a.order??0)-(b.order??0)); }
function appGame(id){
  const g = games.find(x=>x.id===id);
  const fact = (v, l) => v ? `<div><b>${v}</b><span>${l}</span></div>` : '';
  const facts = [fact(g.hours ? fmtH(g.hours) : '0h', 'played'), fact(g.rating ? `<span class="stars" style="font-size:14px">${starStr(g.rating)}</span>` : 'None', 'rating'),
    fact(g.own ? OWN[g.own] : 'Not set', 'owned'),
    fact(g.startedAt && (g.status==='playing'||g.status==='hold') ? esc(fmtDate(g.startedAt)) : '', 'started'),
    fact(g.status==='beaten' ? (g.finishedAt ? esc(fmtDate(g.finishedAt)) : 'Unknown') : '', g.complete ? 'beaten at 100%' : 'beaten'),
    fact(clears(g) > 1 ? `×${clears(g)}` : '', 'clears')].join('');
  const chain = g.series?.trim() ? chainFor(g) : [], pos = chain.indexOf(g);
  return `<div class="gp-top">${discHTML(g, 110)}<div style="min-width:0"><span class="eyebrow">${g.complete ? '100% complete' : ST[g.status].long}</span>
      <h2>${esc(g.title)}</h2><span class="m">${esc([g.series ? (subOf(g) ? `${seriesOf(g)} (${subOf(g)})` : seriesOf(g)) : 'Standalone', g.platform].filter(Boolean).join(', '))}</span>${tagChips(g)}</div></div>
    <fieldset class="group"><legend>Status</legend><div class="gp-status">${Object.keys(ST).map(k=>`<button data-setstatus="${k}" data-gid="${g.id}" aria-pressed="${g.status===k}">${ST[k].long}</button>`).join('')}</div></fieldset>
    <fieldset class="group"><legend>Details</legend><div class="facts">${facts}</div></fieldset>
    ${chain.length > 1 ? `<fieldset class="group"><legend>Play order</legend><div class="order-row"><span>${pos+1} of ${chain.length} in ${esc(subOf(g) || seriesOf(g))}</span>
      <button class="btn" data-gmove="-1" data-gid="${g.id}" ${pos===0?'disabled':''}>Earlier</button><button class="btn" data-gmove="1" data-gid="${g.id}" ${pos===chain.length-1?'disabled':''}>Later</button></div></fieldset>` : ''}
    ${g.notes ? `<fieldset class="group"><legend>Notes</legend><div class="gp-notes">${esc(g.notes)}</div></fieldset>` : ''}
    <div class="gp-actions">${g.status==='playing' ? `<button class="btn" data-hour="${g.id}">+1 hour</button>` : ''}
      ${g.status==='backlog' || g.status==='hold' ? `<button class="btn" data-load="${g.id}">${ICONS.play} Play now</button>` : ''}
      <button class="btn primary" data-id="${g.id}">Edit</button></div>
    <p class="set-note" style="text-align:center;margin-top:14px">Tap outside to close</p>`;
}

/* ---------- Backup actions ---------- */
function backupText(withCovers){ return JSON.stringify({ app:'game-shelf', version:1, exported:new Date().toISOString(), games, prefs, covers: withCovers ? covers : undefined }); }
function markBackedUp(){ prefs.lastBackup = Date.now(); savePrefs(); render(); }
function doRestore(){
  const ta = $('bkText'); let data;
  try{ data = JSON.parse(ta.value.trim()); }catch(e){ return toast('That doesn\u2019t look like a Game Shelf backup.'); }
  if (!data || data.app !== 'game-shelf' || !Array.isArray(data.games)) return toast('That doesn\u2019t look like a Game Shelf backup.');
  if (!restoreArmed2){ restoreArmed2 = true; const b = $('bkRestore'); if (b) b.textContent = `Tap again to replace with ${data.games.length} games`; return; }
  snapshot(); games = data.games; if (data.covers) covers = data.covers;
  prefs = { goals:{}, ...(data.prefs || {}), lastBackup: prefs.lastBackup };
  [...games].sort((a,b)=>(a.order??0)-(b.order??0)).forEach((g,i)=>{ g.order = i; });
  save(); if (data.covers) saveCovers(); savePrefs(); applyTheme();
  restoreOpen = false; restoreArmed2 = false; render(); toast(`Restored ${games.length} games`, true);
}

/* ---------- Theme hook: wallpapers ---------- */

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#sheet') || t.closest('#toast')) return;
  if (t.closest('#dscrim')) return closeDrawer();
  // taskbar + start
  const la = t.closest('[data-launch]'); if (la){ openWin(la.dataset.launch); return; }
  const ln = t.closest('[data-libnav]'); if (ln){ lib.nav = ln.dataset.libnav; lib.q = ''; openWin('library'); return; }
  if (!t.closest('#start') && !$('start').hidden) closeStart();
  // game actions
  const gg = t.closest('[data-game]'); if (gg){ return openDrawer(gg.dataset.game); }
  const d = t.closest('[data-id]'); if (d){ const g = games.find(x=>x.id===d.dataset.id); closeDrawer(); return openSheet(g); }
  const ss = t.closest('[data-setstatus]');
  if (ss){ const g = games.find(x=>x.id===ss.dataset.gid); if (g.status === ss.dataset.setstatus) return; snapshot(); applyStatus(g, ss.dataset.setstatus); save(); render(); return toast(`${g.title}: ${ST[g.status].long}`, true); }
  const gm = t.closest('[data-gmove]');
  if (gm){ const g = games.find(x=>x.id===gm.dataset.gid), ch = chainFor(g), i = ch.indexOf(g), j = i + +gm.dataset.gmove; if (j < 0 || j >= ch.length) return;
    snapshot(); [g.order, ch[j].order] = [ch[j].order, g.order]; save(); render(); return toast('Play order updated', true); }
  const ptk = t.closest('[data-ptrack]');
  if (ptk){ const pl = games.filter(g=>g.status==='playing').sort((a,b)=>(b.startedAt||0)-(a.startedAt||0)); if (pl.length < 2) return;
    const i = Math.max(0, pl.findIndex(g=>g.id===homePick)); homePick = pl[(i + +ptk.dataset.ptrack + pl.length) % pl.length].id; return render(); }
  const ld = t.closest('[data-load]');
  if (ld){ snapshot(); const g = games.find(x=>x.id===ld.dataset.load); applyStatus(g, 'playing'); homePick = g.id; save(); render(); return toast(`Now playing ${g.title}`, true); }
  const qk = t.closest('[data-quick]');
  if (qk){ snapshot(); const g = games.find(x=>x.id===qk.dataset.quick); applyStatus(g, qk.dataset.to); save(); render(); return toast(`${g.title}: ${ST[g.status].long}`, true); }
  const hr = t.closest('[data-hour]');
  if (hr){ snapshot(); const g = games.find(x=>x.id===hr.dataset.hour); addHours(g, 1); save(); render(); return toast(`${g.title}: ${fmtH(g.hours)} played`, true); }
  // library
  const lv = t.closest('[data-lview]'); if (lv){ lib.view = lv.dataset.lview; return render(); }
  // settings
  const wl = t.closest('[data-wallpick]'); if (wl){ prefs.wall = wl.dataset.wallpick; applyTheme(); savePrefs(); return render(); }
  if (t.id === 'bkSave'){
    const txt = backupText($('bkCovers')?.checked !== false);
    try{ const a = document.createElement('a'); a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(txt); a.download = `game-shelf-backup-${toInput()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); markBackedUp(); toast('Backup saved. If no file appeared, use Copy backup instead.'); }
    catch(err){ toast('Saving a file is blocked here. Use Copy backup instead.'); }
    return;
  }
  if (t.id === 'bkCopy'){
    const txt = backupText($('bkCovers')?.checked !== false);
    navigator.clipboard.writeText(txt).then(() => { markBackedUp(); toast('Backup copied. Paste it into Notes or Files to keep it.'); })
      .catch(() => { restoreOpen = true; render(); const ta = $('bkText'); if (ta){ ta.value = txt; ta.focus(); ta.select(); } toast('Copying is blocked here. The backup is selected, so tap Copy.'); });
    return;
  }
  if (t.id === 'bkRestoreOpen'){ restoreOpen = !restoreOpen; restoreArmed2 = false; return render(); }
  if (t.id === 'bkCancel'){ restoreOpen = false; restoreArmed2 = false; return render(); }
  if (t.id === 'bkRestore') return doRestore();
  if (t.id === 'bkChoose'){ const fi = $('bkFile'); if (fi){ fi.value = ''; fi.click(); } return; }
  // stats, timeline, spin (shared with the old views)
  if (t.id === 'spinBtn') return doSpin();
  if (t.id === 'goalBtn'){ goalEditing = true; render(); setTimeout(()=>$('goalInput')?.focus(), 50); return; }
  if (t.id === 'goalCancel'){ goalEditing = false; return render(); }
  if (t.id === 'goalSave' || t.id === 'goalClear'){
    const y = new Date().getFullYear(), n = t.id === 'goalClear' ? 0 : parseInt($('goalInput').value, 10);
    if (t.id === 'goalSave' && !(n > 0)){ toast('Enter a number of games, like 20.'); return; }
    if (n > 0) prefs.goals[y] = n; else delete prefs.goals[y];
    goalEditing = false; savePrefs(); render(); return toast(n > 0 ? `Goal set: ${n} games in ${y}` : 'Goal removed');
  }
  const tlk = t.closest('[data-tlk]');
  if (tlk){ const node = tlk.closest('.tl-node'), open = !node.classList.contains('open');
    document.querySelectorAll('.tl-node.open').forEach(n => { n.classList.remove('open'); n.querySelector('[data-tlk]').setAttribute('aria-expanded','false'); });
    if (open){ node.classList.add('open'); tlk.setAttribute('aria-expanded','true'); } return; }
  const tly = t.closest('[data-tly]'); if (tly){ tlYear = tly.dataset.tly === 'all' ? 'all' : +tly.dataset.tly; return render(); }
  const tlf = t.closest('[data-tlf]'); if (tlf){ tlFilter = tlf.dataset.tlf; return render(); }
  const tlm = t.closest('[data-tlm]'); if (tlm){ document.getElementById('tlm-' + tlm.dataset.tlm)?.scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  const rc = t.closest('[data-recap]'); if (rc){ recapYear = +rc.dataset.recap; return render(); }
});
document.addEventListener('change', e => {
  const id = e.target.id, v = e.target.value;
  if (id==='libSort'){ lib.sort = v; render(); }
  if (id==='libNavSel'){ lib.nav = v; lib.q = ''; render(); }
  if (id==='spinConsole'){ spinConsole = v; render(); }
  if (id==='spinSeries'){ spinSeries = v; render(); }
  if (id==='spinTag'){ spinTag = v; render(); }

  if (id==='bkFile'){ const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => {

      const info = $('bkLoaded'); let msg;
      try{ const d = JSON.parse(String(r.result).trim()); msg = d && d.app === 'game-shelf' && Array.isArray(d.games)
          ? `✓ Loaded ${f.name}: ${d.games.length} games${d.exported ? `, saved ${new Date(d.exported).toLocaleDateString()}` : ''}${d.covers ? ', with cover photos' : ''}. Tap Restore backup below.`
          : `That file doesn't look like a Game Shelf backup. Pick the file named game-shelf-backup.`; }
      catch(err){ msg = `That file doesn't look like a Game Shelf backup. Pick the file named game-shelf-backup.`; }
      if (info){ info.hidden = false; info.textContent = msg; }
      document.getElementById('bkRestore')?.scrollIntoView({ behavior:'smooth', block:'center' });
      e.target.value = '';
    };
    r.onerror = () => toast('That file could not be read.'); r.readAsText(f); }
});
document.addEventListener('input', e => {

document.addEventListener('keydown', e => {

setInterval(renderTaskbar, 30000);
/* ===================================================================
   Trophies live inside each game's panel (tap a disc).

ICONS.trophy = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4.5a2.5 2.5 0 0 0 2.5 4M17 6h2.5a2.5 2.5 0 0 1-2.5 4"/><path d="M12 14v3M8.5 20h7M9.5 17h5v3h-5z"/></svg>';
const TTYPES = { plat:['Platinum','#9FC9FF'], gold:['Gold','#F2C14E'], silver:['Silver','#C3CED9'], bronze:['Bronze','#D89A62'], none:['Trophy','#B49CFF'] };
let trFilter = 'all', trType = 'none', trPaste = false, trEdit = null, trOpen = false;
const trophiesOf = g => Array.isArray(g?.trophies) ? g.trophies : [];
const trDone = g => trophiesOf(g).filter(t => t.earned).length;
const cup = (type, size = 20) => `<span class="cup" style="--c:${(TTYPES[type] || TTYPES.none)[1]};width:${size}px;height:${size}px">${ICONS.trophy}</span>`;

const MEDAL = { plat:['#F2FAFF','#9FC9FF','#FFFFFF','#6F9BD8'], gold:['#FFF3B0','#E9B43C','#FFE38A','#B97A12'], silver:['#FFFFFF','#B9C6D3','#F2F6F9','#8395A8'],
  bronze:['#FFD8B4','#C97B3E','#F2B07A','#8E5224'], none:['#EEE6FF','#9B7BFF','#DCCFFF','#6040D0'] };
const medal = (type, size, on = true) => { const m = MEDAL[type] || MEDAL.none;
  return `<span class="medal ${on ? 'on' : ''}" style="width:${size}px;height:${size}px;--m1:${m[0]};--m2:${m[1]};--m3:${m[2]};--m4:${m[3]}">${ICONS.trophy}</span>`; };
let trSort = 'default', trShowEarned = true;
const relDay = ts => { const d0 = new Date(); d0.setHours(0,0,0,0); const d = new Date(ts); d.setHours(0,0,0,0); const n = Math.round((d0 - d) / 864e5);
  return n <= 0 ? 'today' : n === 1 ? 'yesterday' : n < 7 ? `${n} days ago` : fmtDate(ts); };
let trGuideEdit = false, trJustAdded = null;
function trophySection(g){
  const list = trophiesOf(g), n = list.length, d = trDone(g), pct = n ? Math.round(d / n * 100) : 0, full = n && d === n;
  const types = ['plat','gold','silver','bronze','none'].filter(k => list.some(t => (t.type || 'none') === k));
  const tally = types.map(k => { const of = list.filter(t => (t.type || 'none') === k); return `<span class="tl-t">${medal(k, 18)}<b>${of.filter(t => t.earned).length}<small>/${of.length}</small></b></span>`; }).join('');
  const stack = n ? `<span class="tstack" aria-hidden="true">${types.map(k => { const e = list.filter(t => (t.type || 'none') === k && t.earned).length; return e ? `<i style="width:${e / n * 100}%;background:linear-gradient(180deg,${MEDAL[k][0]},${k === 'silver' ? MEDAL[k][3] : MEDAL[k][1]})"></i>` : ''; }).join('')}</span>` : '';
  const missLeft = list.filter(t => t.missable && !t.earned).length, pinned = list.filter(t => t.pinned && !t.earned);
  const others = list.filter(t => t.type !== 'plat'), plat = list.find(t => t.type === 'plat' && !t.earned);
  const platReady = plat && others.length && others.every(t => t.earned);
  const nextUp = pinned[0] || list.find(t => !t.earned && t.type !== 'plat');

  const seen = prefs.featSeen || [], fresh = FEATURES.filter(f => f.isNew && !seen.includes(f.id) && !(prefs.features || {}).hasOwnProperty(f.id));
  if (!fresh.length) return;
  prefs.featSeen = [...seen, ...fresh.map(f => f.id)]; savePrefs();
  setTimeout(() => toast(fresh.length === 1 ? `New: ${fresh[0].name}. Turn it on in Settings, Features` : `${fresh.length} new features to try in Settings, Features`), 1200);
}

/* ---------- 1) Play timer ---------- */
let pillTick = null;
const timerNow = () => featOn('timer') && prefs.timer && games.find(g => g.id === prefs.timer.id) ? prefs.timer : null;
const PLAY_I = '<svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg>', PAUSE_I = '<svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1.5" fill="currentColor"/><rect x="14" y="4.5" width="4.5" height="15" rx="1.5" fill="currentColor"/></svg>';
const timerMs = t => t ? Math.max(0, (t.pausedAt || Date.now()) - t.start - (t.pausedMs || 0)) : 0;

  const draw = () => { ov.innerHTML = `<div class="tm-card"><p class="tm-e">Session done</p><h2>${esc(g.title)}</h2>
      <p class="tm-big">${fmtH(h)}</p>${ms > 12 * 3600000 ? '<p class="set-note" style="color:#D9465A;margin:0 0 8px">That\u2019s a long one. Did you forget to stop it?</p>' : ''}

const dayKey = t => toInput(t);

  const m = {};
  games.forEach(g => (g.log || []).forEach(e => { if (!e.t || !e.h || e.h > 16) return; const k = dayKey(e.t); (m[k] ||= { h:0, games:new Set() }); m[k].h += e.h; if (e.h > 0) m[k].games.add(g.title); }));

  keys.forEach(k => { const t = new Date(k + 'T12:00:00'); run = prev && (t - prev) / 864e5 === 1 ? run + 1 : 1; best = Math.max(best, run); prev = t; });

/* ===================================================================

   =================================================================== */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function wrapData(Y){
  const inY = t => t && new Date(t).getFullYear() === Y;

  const sess = games.flatMap(g => (g.sessions || []).filter(s => inY(s.at)).map(s => ({ g, t:s.at, h:s.ms / 3600000 })));
  const hours = logs.reduce((a, e) => a + e.h, 0), beaten = games.filter(g => g.status === 'beaten' && inY(g.finishedAt)).sort((a, b) => a.finishedAt - b.finishedAt);

  let top = [...byGame.entries()].sort((a, b) => b[1] - a[1])[0];
  if (!top){ const c = games.filter(g => (inY(g.startedAt) || inY(g.finishedAt) || g.status === 'playing') && g.hours).sort((a, b) => b.hours - a.hours)[0]; if (c) top = [c, c.hours, true]; }

  const con = [...byCon.entries()].sort((a, b) => b[1] - a[1])[0];
  const longest = [...sess, ...logs].sort((a, b) => b.h - a.h)[0];
  const byMonth = Array(12).fill(0); logs.forEach(e => byMonth[new Date(e.t).getMonth()] += e.h); beaten.forEach(g => byMonth[new Date(g.finishedAt).getMonth()] += .001);
  const bm = byMonth.indexOf(Math.max(...byMonth)), busiest = byMonth[bm] > 0 ? bm : -1;
  const stamps = [...logs, ...sess].map(e => new Date(e.t)), n = stamps.length;
  const night = stamps.filter(d => d.getHours() >= 22 || d.getHours() < 4).length, morning = stamps.filter(d => d.getHours() >= 5 && d.getHours() < 11).length, wknd = stamps.filter(d => d.getDay() === 0 || d.getDay() === 6).length;
  const avg = n ? [...logs, ...sess].reduce((a, e) => a + e.h, 0) / n : 0;
  const style = !n ? null : night / n > .4 ? ['🦉','Night Owl','You do your best gaming after dark.'] : morning / n > .4 ? ['🐦','Early Bird','You like to play before the day gets going.']
    : wknd / n > .6 ? ['🏖️','Weekend Warrior','Weekends are game time.'] : avg >= 2 ? ['🏃','Marathoner','When you sit down to play, you settle in.'] : ['🎮','Steady Player','A little bit of play, here and there, all year.'];
  const bySeries = new Map(); beaten.forEach(g => { if (g.series?.trim()){ const s = seriesOf(g); bySeries.set(s, (bySeries.get(s) || 0) + 1); } });
  const ser = [...bySeries.entries()].sort((a, b) => b[1] - a[1])[0];
  const added = games.filter(g => { const t = parseInt(String(g.id).slice(0, 8), 36); return t > 1.4e12 && new Date(t).getFullYear() === Y; }).length;
  return { Y, hours, beaten, top, con, longest, busiest, style, ser, added, logs:logs.length, total:games.reduce((a, g) => a + (g.hours || 0), 0) };
}
const wrapH = h => h >= 10 ? `${Math.round(h)}` : (Math.round(h * 10) / 10).toString();
function wrapSlides(D){

  S.push(`<div class="wr-c"><span class="wr-k">Game Shelf</span><div class="wr-hero"><span class="wr-bigdisc"></span></div><h1>Your ${D.Y}<br>Wrapped</h1><p>Tap to see your year on the shelf</p></div>`);
  if (D.hours > 0) S.push(`<div class="wr-c"><span class="wr-k">Time played</span><p class="wr-pre">This year you played for</p><b class="wr-num" data-count="${D.hours}">${wrapH(D.hours)}</b><p class="wr-unit">hours</p><p>${D.hours >= 24 ? `That's ${(D.hours / 24).toFixed(1)} whole days.` : D.hours >= 1 ? `That's about ${Math.round(D.hours * 60)} minutes of games.` : 'Every minute counts.'}</p></div>`);
  else S.push(`<div class="wr-c"><span class="wr-k">Time played</span><p class="wr-pre">Your shelf holds</p><b class="wr-num" data-count="${D.total}">${wrapH(D.total)}</b><p class="wr-unit">hours of play</p><p>Log hours this year and next year's Wrapped will tell the story.</p></div>`);
  if (D.beaten.length) S.push(`<div class="wr-c"><span class="wr-k">Games beaten</span><b class="wr-num" data-count="${D.beaten.length}">${D.beaten.length}</b><p class="wr-unit">game${D.beaten.length === 1 ? '' : 's'} beaten in ${D.Y}</p><div class="wr-row">${D.beaten.slice(-6).map(g => disc(g, 52)).join('')}</div><p>The first was <b>${esc(D.beaten[0].title)}</b>, the latest <b>${esc(D.beaten[D.beaten.length - 1].title)}</b>.</p></div>`);

  if (D.busiest >= 0) S.push(`<div class="wr-c"><span class="wr-k">Busiest month</span><h2 class="wr-month">${MONTHS[D.busiest]}</h2><p>Your most active month on the shelf.</p></div>`);

  if (D.added) S.push(`<div class="wr-c"><span class="wr-k">Your shelf grew</span><b class="wr-num" data-count="${D.added}">${D.added}</b><p class="wr-unit">games added</p><p>Now ${games.length} on the shelf.</p></div>`);
  S.push(`<div class="wr-c wr-end"><span class="wr-k">That's a wrap</span><div class="wr-sum">
      <div><b>${wrapH(D.hours || D.total)}</b><span>${D.hours ? 'hours played' : 'hours total'}</span></div><div><b>${D.beaten.length}</b><span>beaten</span></div>
      <div class="wide"><b>${D.top ? esc(D.top[0].title) : '—'}</b><span>top game</span></div>${D.style ? `<div class="wide"><b>${D.style[0]} ${D.style[1]}</b><span>play style</span></div>` : ''}</div>
      <button class="btn primary wr-share" data-wrshare>Share my Wrapped</button><button class="btn wr-again" data-wragain>Watch again</button></div>`);
  return S;
}
let wrapState = null;
function wrapOpen(){
  const D = wrapData(new Date().getFullYear()), S = wrapSlides(D), ov = document.createElement('div'); ov.id = 'wrapView'; ov.className = 'wrap-ov';
  wrapState = { D, S, i:0, timer:null };
  ov.innerHTML = `<div class="au-sky"><span class="au-rib r1"></span><span class="au-rib r2"></span><span class="au-rib r3"></span><span class="au-rib r4"></span></div>
    <div class="wr-bars">${S.map(() => '<i><b></b></i>').join('')}</div><button class="wr-x" data-wrclose aria-label="Close">✕</button>
    <div class="wr-stage"></div><button class="wr-tap prev" data-wrprev aria-label="Back"></button><button class="wr-tap next" data-wrnext aria-label="Next"></button>`;
  document.body.appendChild(ov); wrapShow(0);
  ov.addEventListener('click', e => { const t = e.target;
    if (t.closest('[data-wrclose]')) return wrapClose();
    if (t.closest('[data-wrshare]')) return wrapShare();
    if (t.closest('[data-wragain]')) return wrapShow(0);
    if (t.closest('[data-wrprev]')) return wrapShow(wrapState.i - 1);
    if (t.closest('[data-wrnext]')) return wrapShow(wrapState.i + 1); });
}
function wrapClose(){ clearTimeout(wrapState?.timer); $('wrapView')?.remove(); wrapState = null; }
function wrapShow(i){
  const st = wrapState, ov = $('wrapView'); if (!st || !ov) return; if (i < 0) i = 0; if (i >= st.S.length) return; st.i = i; clearTimeout(st.timer);
  ov.querySelector('.wr-stage').innerHTML = st.S[i];

  ov.querySelector('.wr-tap.next').hidden = i === st.S.length - 1;
  ov.querySelectorAll('[data-count]').forEach(el => { const to = +el.dataset.count, t0 = performance.now(); const step = now => { const p = Math.min(1, (now - t0) / 900); el.textContent = wrapH(to * (1 - Math.pow(1 - p, 3))); if (p < 1 && el.isConnected) requestAnimationFrame(step); }; requestAnimationFrame(step); });
  if (i < st.S.length - 1) st.timer = setTimeout(() => wrapShow(i + 1), 5200);

/* a share card drawn on a canvas, saved through the share sheet */
async function wrapShare(){
  const D = wrapState.D, W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const bg = x.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#16285E'); bg.addColorStop(1, '#050B24'); x.fillStyle = bg; x.fillRect(0, 0, W, H);
  [['#5FF2B0',200,260],['#9B7BFF',880,420],['#FF7FC8',300,900],['#5FD8FF',820,1150]].forEach(([col, cx, cy]) => { const r = x.createRadialGradient(cx, cy, 0, cx, cy, 460); r.addColorStop(0, col + '88'); r.addColorStop(1, col + '00'); x.fillStyle = r; x.fillRect(0, 0, W, H); });
  const cx = W / 2, cy = 330, R = 170, cg = x.createConicGradient ? x.createConicGradient(-1.2, cx, cy) : null;
  if (cg){ ['#5FD8FF','#9B7BFF','#FF7FC8','#FFE066','#5FF2B0','#5FD8FF'].forEach((col, k) => cg.addColorStop(k / 5, col)); x.fillStyle = cg; } else x.fillStyle = '#9B7BFF';
  x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.fill(); x.lineWidth = 10; x.strokeStyle = '#fff'; x.stroke();
  x.fillStyle = '#fff'; x.beginPath(); x.arc(cx, cy, 46, 0, Math.PI * 2); x.fill(); x.fillStyle = '#16285E'; x.beginPath(); x.arc(cx, cy, 20, 0, Math.PI * 2); x.fill();
  x.textAlign = 'center'; x.fillStyle = '#fff'; x.font = '900 84px -apple-system, system-ui, sans-serif'; x.fillText(`My ${D.Y} Wrapped`, cx, 640);
  const rows = [[wrapH(D.hours || D.total), D.hours ? 'hours played' : 'hours total'], [String(D.beaten.length), 'games beaten'], [D.top ? D.top[0].title : '—', 'top game'], [D.style ? `${D.style[0]} ${D.style[1]}` : (D.con ? D.con[0] : '—'), D.style ? 'play style' : 'top console']];
  rows.forEach(([v, l], k) => { const y = 780 + k * 130; x.font = '900 64px -apple-system, system-ui, sans-serif'; let txt = v; while (x.measureText(txt).width > 900 && txt.length > 4) txt = txt.slice(0, -2); if (txt !== v) txt = txt.trim() + '…';
    x.fillStyle = '#fff'; x.fillText(txt, cx, y); x.font = '800 30px -apple-system, system-ui, sans-serif'; x.fillStyle = 'rgba(255,255,255,.7)'; x.fillText(l.toUpperCase(), cx, y + 44); });

}
